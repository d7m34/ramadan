<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>نور - تطبيق إسلامي</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body{margin:0;background:#0A0E0D;color:white;font-family:sans-serif}
  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

/* 🔥 مهم جداً — هذا كان سبب الشاشة السوداء */
const { useState, useEffect } = React;

/* =================== مثال مبسّط للتأكد أنه يعمل =================== */
/* يمكنك لاحقاً إرجاع مشروعك الكامل بعد التأكد أن هذه النسخة تعمل */

function App() {
  const [count, setCount] = useState(0);

  return (
    <div style={{padding:40,textAlign:"center"}}>
      <h1>تطبيق نور يعمل بنجاح ✅</h1>
      <p>إذا ترى هذا فـ GitHub Pages يعمل 100%</p>

      <button 
        onClick={() => setCount(count + 1)}
        style={{
          padding:"12px 20px",
          fontSize:18,
          background:"#C9A84C",
          border:"none",
          borderRadius:8,
          cursor:"pointer"
        }}
      >
        عداد: {count}
      </button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
