<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>نور | منصة إسلامية متكاملة</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js'"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js'"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js'"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== THEME VARIABLES ===== */
:root {
  --bg:#07090f; --bg2:#0d1117; --card:#111827; --card2:#162033;
  --border:rgba(99,102,241,0.15); --border2:rgba(255,255,255,0.06);
  --text:#f1f5f9; --text2:#94a3b8; --text3:#64748b;
  --r:18px; --glow-sm:0 2px 20px rgba(0,0,0,0.4);
  /* Default: Indigo */
  --p1:#6366f1; --p2:#818cf8; --p3:#c7d2fe;
  --g1:#f59e0b; --g2:#fbbf24; --g3:#fde68a;
}
.th-green  { --p1:#059669; --p2:#34d399; --p3:#a7f3d0; --g1:#84cc16; --g2:#a3e635; --g3:#d9f99d; }
.th-gold   { --p1:#b45309; --p2:#d97706; --p3:#fcd34d; --g1:#92400e; --g2:#b45309; --g3:#fef3c7; }
.th-blue   { --p1:#0284c7; --p2:#38bdf8; --p3:#bae6fd; --g1:#0369a1; --g2:#0ea5e9; --g3:#e0f2fe; }
.th-rose   { --p1:#be185d; --p2:#f472b6; --p3:#fbcfe8; --g1:#9d174d; --g2:#ec4899; --g3:#fce7f3; }
.light {
  --bg:#f8faff; --bg2:#eef2ff; --card:#ffffff; --card2:#f0f4ff;
  --border:rgba(99,102,241,0.18); --border2:rgba(0,0,0,0.06);
  --text:#1e1b4b; --text2:#4c1d95; --text3:#6d28d9;
}

/* ===== RESET & BASE ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--text);
  font-family:'Tajawal',sans-serif;min-height:100vh;
  transition:background .35s,color .35s;overflow-x:hidden;
  line-height:1.6;
}

/* Atmospheric background */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.12;animation:orb-float 12s ease-in-out infinite;}
.orb1{width:400px;height:400px;background:var(--p1);top:-100px;right:-100px;animation-delay:0s;}
.orb2{width:300px;height:300px;background:var(--g1);bottom:-80px;left:-80px;animation-delay:-4s;}
.orb3{width:200px;height:200px;background:var(--p2);top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-8s;}
@keyframes orb-float{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-30px) scale(1.05);}}
.light .orb{opacity:.06;}

#root{position:relative;z-index:1;}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--p1);border-radius:4px;}

/* ===== HEADER ===== */
.app-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;
  background:rgba(7,9,15,0.82);backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:500;
  border-bottom:1px solid var(--border2);
}
.light .app-header{background:rgba(248,250,255,0.88);}
.logo-wrap{display:flex;align-items:center;gap:8px;}
.logo-star{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--p1),var(--g2));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:0 0 20px rgba(99,102,241,0.35);
}
.logo-text{font-size:20px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(135deg,var(--p2),var(--g2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header-actions{display:flex;gap:8px;}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  transition:.2s;color:var(--text2);
}
.icon-btn:hover{background:var(--card);transform:scale(1.08);border-color:var(--p1);}

/* ===== MAIN CONTENT ===== */
.main{padding:16px 15px 90px;max-width:600px;margin:0 auto;}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.8;}100%{transform:scale(1.3);opacity:0;}}
@keyframes shimmer{0%{background-position:200% center;}100%{background-position:-200% center;}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}  }

/* ===== CARD ===== */
.card{
  background:var(--card);border:1px solid var(--border2);
  border-radius:var(--r);padding:18px;margin-bottom:12px;
  box-shadow:var(--glow-sm);
  animation:fadeUp .4s ease both;
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.card:hover{transform:translateY(-2px);border-color:var(--border);box-shadow:0 8px 40px rgba(0,0,0,.3);}
.card-inner{background:var(--card2);border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid var(--border2);}

/* ===== PAGE TITLE ===== */
.page-title{
  font-size:22px;font-weight:900;margin-bottom:4px;
  background:linear-gradient(135deg,var(--p2),var(--g2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:18px;}

/* ===== SECTION LABEL ===== */
.sec-label{
  font-size:11px;font-weight:800;color:var(--text3);letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:10px;padding-right:2px;
  display:flex;align-items:center;gap:6px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border2);}

/* ===== GRADIENT TEXT ===== */
.grad{
  background:linear-gradient(135deg,var(--p2),var(--g2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 18px;border-radius:12px;border:none;cursor:pointer;
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;
  transition:.2s;
}
.btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;}
.btn-primary:hover{opacity:.88;transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-ghost:hover{border-color:var(--p1);color:var(--p2);}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:10px;}
.btn-back{
  background:none;border:none;color:var(--p2);font-weight:700;font-size:14px;
  cursor:pointer;padding:7px 12px;border-radius:10px;
  display:inline-flex;align-items:center;gap:5px;
  font-family:'Tajawal',sans-serif;
  margin-bottom:14px;transition:.2s;
}
.btn-back:hover{background:rgba(99,102,241,.1);}

/* ===== CHIP TABS ===== */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.tab{
  padding:7px 16px;border-radius:20px;font-size:13px;font-weight:700;
  border:1px solid var(--border);background:var(--card2);color:var(--text3);
  cursor:pointer;transition:.2s;font-family:'Tajawal',sans-serif;
}
.tab:hover{border-color:var(--p1);color:var(--p2);}
.tab.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent;}

/* ===== SEARCH ===== */
.search{
  width:100%;padding:12px 16px;background:var(--card);
  border:1px solid var(--border2);border-radius:12px;
  color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;
  outline:none;transition:.3s;margin-bottom:14px;
}
.search::placeholder{color:var(--text3);}
.search:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(99,102,241,.1);}

/* ===== BADGE ===== */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;
  background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff;
}
.badge-ghost{background:var(--card2);border:1px solid var(--border);color:var(--text3);}

/* ===== PROGRESS BAR ===== */
.prog-wrap{height:6px;background:var(--card2);border-radius:6px;overflow:hidden;}
.prog-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--p1),var(--g2));transition:width .4s;}

/* ===== BOTTOM NAV ===== */
.nav{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;justify-content:space-around;align-items:center;
  background:rgba(11,14,22,0.93);backdrop-filter:blur(22px);
  padding:8px 4px 18px;border-top:1px solid var(--border2);z-index:500;
}
.light .nav{background:rgba(248,250,255,0.94);}
.nav-btn{
  background:none;border:none;color:var(--text3);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;padding:6px 10px;border-radius:12px;
  font-family:'Tajawal',sans-serif;font-size:11px;font-weight:700;
  transition:.2s;min-width:52px;
}
.nav-btn .ni{font-size:22px;line-height:1;}
.nav-btn.on{color:var(--g2);}
.nav-btn.on .ni{filter:drop-shadow(0 0 6px var(--g2));}
.nav-btn:not(.on):hover{color:var(--text2);}

/* ===== HOME ===== */
.home-greeting{
  padding:20px 0 16px;animation:fadeUp .35s ease both;
}
.greeting-top{font-size:13px;color:var(--text3);margin-bottom:4px;}
.greeting-main{font-size:24px;font-weight:900;}
.hijri-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card2);border:1px solid var(--border);
  border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;
  color:var(--g2);margin-top:8px;
}

/* Hadith Banner */
.hadith-banner{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0f0a2a 0%,#0d1117 100%);
  border:1px solid rgba(245,200,66,0.2);
  border-radius:var(--r);padding:20px 20px 16px;
  margin-bottom:12px;animation:fadeUp .38s ease both;
}
.light .hadith-banner{background:linear-gradient(135deg,#ede9fe,#f5f3ff);}
.hadith-banner::before{
  content:'❝';position:absolute;left:10px;top:0;
  font-size:80px;opacity:.06;color:var(--g2);font-family:serif;line-height:1;
}
.hadith-tag{font-size:11px;font-weight:800;color:var(--g2);letter-spacing:1px;margin-bottom:8px;}
.hadith-text{font-family:'Amiri',serif;font-size:18px;line-height:2;color:var(--text);}
.hadith-src{font-size:12px;color:var(--g1);font-weight:700;margin-top:8px;padding-top:8px;border-top:1px solid rgba(245,200,66,.12);}

/* Prayer card */
.prayer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.prayer-cell{
  background:var(--card2);border:1px solid var(--border2);border-radius:12px;
  padding:10px 8px;text-align:center;transition:.2s;
}
.prayer-cell.next-prayer{
  background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(245,200,66,.08));
  border-color:var(--g2);
}
.prayer-cell .p-icon{font-size:18px;margin-bottom:4px;}
.prayer-cell .p-name{font-size:12px;font-weight:800;color:var(--text2);margin-bottom:3px;}
.prayer-cell .p-time{font-size:15px;font-weight:900;color:var(--g2);}
.prayer-cell.next-prayer .p-time{color:var(--g2);filter:drop-shadow(0 0 6px var(--g2));}

/* Home grid */
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.feat-card{
  background:var(--card);border:1px solid var(--border2);border-radius:var(--r);
  padding:20px 16px;text-align:center;cursor:pointer;
  transition:.25s;animation:fadeUp .4s ease both;
  position:relative;overflow:hidden;
}
.feat-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--p1),var(--g2));
  opacity:0;transition:.25s;
}
.feat-card:hover::before{opacity:.07;}
.feat-card:hover{transform:translateY(-4px);border-color:var(--p1);box-shadow:0 12px 40px rgba(0,0,0,.3);}
.feat-card .fi{font-size:38px;margin-bottom:10px;position:relative;}
.feat-card .fl{font-size:15px;font-weight:800;position:relative;}
.feat-card .fd{font-size:11px;color:var(--text3);margin-top:3px;position:relative;}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-box{
  background:var(--card2);border:1px solid var(--border2);border-radius:12px;
  padding:14px 10px;text-align:center;
}
.stat-num{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--p2),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-lbl{font-size:11px;color:var(--text3);font-weight:700;margin-top:2px;}

/* ===== QURAN ===== */
.surah-item{
  display:flex;align-items:center;gap:12px;cursor:pointer;
  padding:14px 16px;background:var(--card);border:1px solid var(--border2);
  border-radius:14px;margin-bottom:8px;transition:.2s;
  animation:fadeUp .4s ease both;
}
.surah-item:hover{border-color:var(--p1);transform:translateX(-3px);}
.sn{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--p1),var(--g2));
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;
}
.si-info{flex:1;}
.si-name{font-size:16px;font-weight:800;}
.si-meta{font-size:12px;color:var(--text3);margin-top:2px;}
.si-arrow{color:var(--text3);font-size:16px;}

.ayah-wrap{
  background:var(--card2);border:1px solid var(--border2);border-radius:14px;
  padding:18px 16px;margin-bottom:10px;
  animation:fadeUp .38s ease both;transition:.2s;
}
.ayah-wrap:hover{border-color:var(--border);}
.ayah-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.ayah-num-badge{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--p1),var(--g2));
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;flex-shrink:0;
}
.ayah-actions{display:flex;gap:6px;}
.ayah-action-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  transition:.2s;
}
.ayah-action-btn:hover{background:var(--card2);border-color:var(--p1);}
.ayah-action-btn.fav{border-color:var(--g2);color:var(--g2);}
.ayah-arabic{font-family:'Amiri Quran',serif;text-align:right;line-height:2.2;}
.ayah-translate{font-size:13px;color:var(--text2);margin-top:10px;padding-top:10px;border-top:1px solid var(--border2);line-height:1.8;}

.font-controls{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.font-size-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;transition:.2s;color:var(--text);
}
.font-size-btn:hover{border-color:var(--p1);color:var(--p2);}
.font-size-label{font-size:12px;color:var(--text3);font-weight:700;}

/* Loading spinner */
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--p2);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}

/* ===== AZKAR ===== */
.zikr-card{
  background:var(--card);border:1px solid var(--border2);border-radius:14px;
  padding:16px;margin-bottom:10px;transition:.2s;
  animation:fadeUp .4s ease both;
}
.zikr-card.done{opacity:.45;}
.zikr-text{font-family:'Amiri',serif;font-size:18px;line-height:2;margin-bottom:10px;color:var(--text);}
.zikr-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.zikr-progress{flex:1;}
.zikr-count-text{font-size:12px;color:var(--text3);margin-bottom:5px;font-weight:700;}
.zikr-tap{
  background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff;
  border:none;border-radius:12px;padding:8px 18px;
  font-family:'Tajawal',sans-serif;font-weight:800;font-size:13px;cursor:pointer;
  transition:.15s;white-space:nowrap;
}
.zikr-tap:hover{opacity:.9;}
.zikr-tap:active{transform:scale(.95);}
.zikr-done-icon{font-size:22px;}

/* ===== TASBIH ===== */
.tasbih-page{text-align:center;padding-top:10px;}
.preset-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none;}
.preset-scroll::-webkit-scrollbar{display:none;}
.preset-chip{
  white-space:nowrap;padding:7px 16px;border-radius:20px;
  border:1px solid var(--border);background:var(--card2);color:var(--text3);
  font-size:13px;font-weight:700;cursor:pointer;transition:.2s;
  font-family:'Tajawal',sans-serif;
}
.preset-chip.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent;}
.tasbih-outer{
  position:relative;width:230px;height:230px;margin:0 auto 20px;cursor:pointer;
}
.pulse-ring{
  position:absolute;inset:-8px;border-radius:50%;
  border:2px solid var(--g2);opacity:0;
}
.tasbih-outer:active .pulse-ring{animation:pulse-ring .35s ease forwards;}
.tasbih-circle{
  width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--card2),var(--bg2));
  border:3px solid var(--g2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 60px rgba(99,102,241,.15),0 0 100px rgba(245,200,66,.06),inset 0 0 40px rgba(0,0,0,.2);
  transition:transform .1s,box-shadow .1s;
  user-select:none;
}
.tasbih-outer:active .tasbih-circle{transform:scale(.96);}
.tasbih-num{font-size:64px;font-weight:900;line-height:1;color:var(--g2);}
.tasbih-sub{font-size:13px;color:var(--text3);margin-top:4px;}
.tasbih-label{font-size:15px;font-weight:800;color:var(--p2);margin-top:6px;}
.tasbih-prog{width:230px;margin:0 auto 16px;}
.tasbih-prog .prog-wrap{height:8px;}
.tasbih-hint{font-size:13px;color:var(--text3);margin-bottom:16px;}
.tasbih-btns{display:flex;gap:10px;justify-content:center;}

/* ===== HADITH PAGE ===== */
.hadith-card{
  background:var(--card);border:1px solid var(--border2);border-radius:var(--r);
  padding:20px;margin-bottom:12px;position:relative;overflow:hidden;
  animation:fadeUp .4s ease both;
}
.hadith-card::before{
  content:'';position:absolute;right:0;top:0;bottom:0;width:4px;
  background:linear-gradient(to bottom,var(--p1),var(--g2));border-radius:0 var(--r) var(--r) 0;
}
.hadith-idx{font-size:11px;font-weight:800;color:var(--p2);letter-spacing:1px;margin-bottom:8px;}
.hadith-body{font-family:'Amiri',serif;font-size:19px;line-height:2;margin-bottom:10px;}
.hadith-meta{display:flex;align-items:center;justify-content:space-between;}
.hadith-source-tag{font-size:12px;color:var(--g2);font-weight:700;background:rgba(245,200,66,.08);padding:4px 12px;border-radius:20px;border:1px solid rgba(245,200,66,.2);}

/* ===== FAVORITES ===== */
.fav-card{
  background:var(--card);border:1px solid rgba(245,200,66,.15);
  border-radius:14px;padding:16px;margin-bottom:10px;
  animation:fadeUp .4s ease both;
}
.fav-type-badge{font-size:11px;font-weight:800;color:var(--g2);margin-bottom:8px;}

/* ===== STATS PAGE ===== */
.stat-detail{
  background:var(--card2);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:10px;
}
.stat-detail-title{font-size:14px;font-weight:800;margin-bottom:12px;color:var(--p2);}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border2);}
.stat-row:last-child{border-bottom:none;}
.stat-row-label{font-size:13px;color:var(--text2);}
.stat-row-val{font-size:14px;font-weight:800;color:var(--g2);}

/* ===== SETTINGS ===== */
.settings-group{margin-bottom:16px;}
.settings-label{font-size:11px;font-weight:800;color:var(--text3);letter-spacing:1.5px;margin-bottom:10px;padding-right:2px;}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--card);border:1px solid var(--border2);
  border-radius:12px;margin-bottom:6px;
}
.settings-row-info{display:flex;align-items:center;gap:10px;}
.settings-row-icon{font-size:20px;}
.settings-row-text .sr-title{font-size:14px;font-weight:700;}
.settings-row-text .sr-sub{font-size:12px;color:var(--text3);margin-top:1px;}
/* Toggle */
.toggle{width:44px;height:24px;border-radius:12px;background:var(--card2);border:1px solid var(--border);cursor:pointer;position:relative;transition:.3s;}
.toggle.on{background:linear-gradient(135deg,var(--p1),var(--p2));}
.toggle::after{content:'';position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.toggle.on::after{right:calc(100% - 19px);}
/* Theme swatches */
.theme-swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{
  width:36px;height:36px;border-radius:50%;cursor:pointer;
  border:3px solid transparent;transition:.2s;
}
.swatch.selected{border-color:var(--text);}

/* ===== WARD (Daily Wird) ===== */
.wird-card{
  background:var(--card);border:1px solid var(--border2);border-radius:14px;
  padding:16px;margin-bottom:10px;animation:fadeUp .4s ease both;
}
.wird-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.wird-title{font-size:15px;font-weight:800;}
.wird-done-badge{
  font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;
  background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.2);
}
.wird-prog-text{font-size:12px;color:var(--text3);margin-bottom:6px;font-weight:700;}

/* ===== LOCATION / PRAYER SETUP ===== */
.location-card{
  background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(245,200,66,.05));
  border:1px solid var(--border);border-radius:var(--r);padding:18px;
  margin-bottom:12px;text-align:center;animation:fadeUp .38s ease both;
}
.location-icon{font-size:40px;margin-bottom:10px;}
.location-title{font-size:16px;font-weight:800;margin-bottom:6px;}
.location-sub{font-size:13px;color:var(--text3);margin-bottom:14px;}

/* Loading overlay */
.loading-overlay{
  position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.loading-logo{font-size:48px;animation:pulse-ring .8s ease infinite;}
.loading-text{font-size:18px;font-weight:800;color:var(--p2);}

<script>
  var _pct=0;
  var _lbar=setInterval(function(){

    var f=document.getElementById('load-fill');
    if(f)f.style.width=_pct+'%';
  },350);
  window._finishLoader=function(){
    clearInterval(_lbar);
    var f=document.getElementById('load-fill');
    if(f)f.style.width='100%';
    setTimeout(function(){
      var el=document.getElementById('pre-loader');
      if(el){el.style.opacity='0';el.style.transition='opacity .5s';setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},500);}

   ============================================================ */

function toHijri(date) {
  // Simple Hijri conversion
  const jd = Math.floor((14 + 365.25*(date.getFullYear()+4716))/365.25)
    + Math.floor((1+date.getMonth())/3/12.0*365)
    + date.getDate() - 1524;
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  const j = Math.floor((10985-l)/5316) * Math.floor((50*l)/17719)
    + Math.floor(l/5670) * Math.floor((43*l)/15238);
  l = l - Math.floor((30-j)/15) * Math.floor((17719*j)/50)
    - Math.floor(j/16) * Math.floor((15238*j)/43) + 29;
  const month = Math.floor((24+l*20)/610);
  const day = l - Math.floor((610*month)/20) + 1;
  const year = 30*n + j - 30 + Math.floor((3+month)/12);
  const months = ["محرم","صفر","ربيع الأول","ربيع الثاني","جمادى الأولى","جمادى الثانية","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
  return `${day} ${months[month-1]} ${year} هـ`;
}

function calcPrayerTimes(lat, lng) {
  const d = new Date();
  const day = d.getDate(), month = d.getMonth()+1, year = d.getFullYear();
  // Simplified calculation (accurate enough for display)
  const tz = -d.getTimezoneOffset()/60;
  const JD = 367*year - Math.floor(7*(year+Math.floor((month+9)/12))/4) + Math.floor(275*month/9) + day - 730531.5;
  const L = (280.46 + 0.9856474*JD) % 360;
  const M = ((357.528 + 0.9856003*JD) % 360) * Math.PI/180;
  const lam = (L + 1.915*Math.sin(M) + 0.02*Math.sin(2*M)) * Math.PI/180;
  const eps = (23.439 - 0.0000004*JD) * Math.PI/180;
  const decl = Math.asin(Math.sin(eps)*Math.sin(lam));
  const eqt = (L/15 - Math.atan2(Math.cos(eps)*Math.sin(lam), Math.cos(lam))*180/Math.PI/15);
  const latR = lat * Math.PI/180;
  const noon = 12 - eqt + (lng - tz*15)/15 * (-1);
  const ha = (a) => Math.acos((Math.sin(a*Math.PI/180)-Math.sin(latR)*Math.sin(decl))/(Math.cos(latR)*Math.cos(decl)));
  const fajrHA = ha(-18) * 180/Math.PI / 15;
  const sunriseHA = ha(-0.8333) * 180/Math.PI / 15;
  const asrHA = Math.acos(Math.sin(Math.atan(1+Math.tan(Math.abs(latR-decl))))-Math.sin(latR)*Math.sin(decl))/(Math.cos(latR)*Math.cos(decl)) * 180/Math.PI / 15;
  const fmt = (h) => { const hh=Math.floor(h), mm=Math.round((h-hh)*60); return `${hh<10?'0'+hh:hh}:${mm<10?'0'+mm:mm}`; };
  return [
    fmt(noon - fajrHA),
    fmt(noon - sunriseHA),
    fmt(noon),
    fmt(noon + asrHA),
    fmt(noon + sunriseHA),
    fmt(noon + sunriseHA + (noon - (noon - fajrHA))*0.35),
  ];
}

function Quran({favorites, toggleFav, onRead}) {
  const [search, setSearch] = useState("");
  const [selected, setSelected] = useState(null);
  const [ayahs, setAyahs] = useState([]);
  const [loading, setLoading] = useState(false);
  const [fontSize, setFontSize] = useState(() => load("quranFontSize", 22));
  const [showTranslate, setShowTranslate] = useState(() => load("showTranslate", true));
  const [showAudio, setShowAudio] = useState(false);

  const fetchAyahs = async (surah) => {
    setLoading(true);
    setAyahs([]);
    try {
      const res = await fetch(`https://api.alquran.cloud/v1/surah/${surah.id}/ar.alafasy`);
      const data = await res.json();
      if (data.code === 200) {
        setAyahs(data.data.ayahs);
        onRead();
      }
    } catch {
      // Fallback
      setAyahs([{numberInSurah:1, text:"تعذّر تحميل السورة. تحقق من الاتصال بالإنترنت."}]);
    }
    setLoading(false);
  };

  const openSurah = (s) => { setSelected(s); fetchAyahs(s); };
  const getTranslation = (surahId, idx) => {
    const tr = TRANSLATIONS[surahId];
    return tr && tr[idx] ? tr[idx] : null;
  };

  useEffect(() => { save("quranFontSize", fontSize); }, [fontSize]);
  useEffect(() => { save("showTranslate", showTranslate); }, [showTranslate]);

  if (selected) {
    const audioBase = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/`;
    return (
      <div className="main">
        <button className="btn-back" onClick={()=>{setSelected(null);setAyahs([]);}}>← القائمة</button>
        <div className="page-title">سورة {selected.name}</div>
        <div className="page-sub">{selected.type} • {selected.ayat} آية</div>

        {/* Controls */}
        <div className="font-controls">
          <span className="font-size-label">حجم الخط:</span>
          <button className="font-size-btn" onClick={()=>setFontSize(f=>Math.max(16,f-2))}>−</button>
          <span style={{fontSize:12,color:"var(--text3)",minWidth:28,textAlign:"center"}}>{fontSize}</span>
          <button className="font-size-btn" onClick={()=>setFontSize(f=>Math.min(36,f+2))}>+</button>
          <button className={`tab btn-sm ${showTranslate?"on":""}`} style={{marginRight:"auto"}} onClick={()=>setShowTranslate(v=>!v)}>
            🌍 ترجمة
          </button>
        </div>

        {loading && <div className="spinner"></div>}

        {ayahs.map((a,i)=>{
          const favKey = `${selected.id}:${a.numberInSurah}`;
          const isFav = favorites.ayahs && favorites.ayahs[favKey];
          const tr = getTranslation(selected.id, i);
          // Global ayah number for audio
          const audioNum = a.number || ((selected.id-1)*100+a.numberInSurah);
          return (
            <div key={i} className="ayah-wrap" style={{animationDelay:`${i*0.03}s`}}>
              <div className="ayah-header">
                <div className="ayah-num-badge">{a.numberInSurah}</div>
                <div className="ayah-actions">
                  <button className={`ayah-action-btn ${isFav?"fav":""}`} title="مفضلة"
                    onClick={()=>toggleFav("ayahs", favKey, {surahName:selected.name, text:a.text, surahId:selected.id, ayahNum:a.numberInSurah})}>
                    {isFav?"⭐":"☆"}
                  </button>
                  <a href={`${audioBase}${a.number||audioNum}.mp3`} target="_blank" rel="noreferrer">
                    <button className="ayah-action-btn" title="استماع">🔊</button>
                  </a>
                </div>
              </div>
              <div className="ayah-arabic" style={{fontSize:fontSize}}>{a.text}</div>
              {showTranslate && tr && <div className="ayah-translate">↳ {tr}</div>}
            </div>
          );
        })}
      </div>
    );
  }

  const filtered = ALL_SURAHS.filter(s => s.name.includes(search) || String(s.id).includes(search));
  return (
    <div className="main">
      <div className="page-title">القرآن الكريم</div>
      <div className="page-sub">114 سورة • يحتاج اتصال بالإنترنت</div>
      <input className="search" placeholder="🔍 ابحث باسم السورة أو رقمها..." value={search} onChange={e=>setSearch(e.target.value)}/>
      {filtered.map((s,i)=>(
        <div key={s.id} className="surah-item" style={{animationDelay:`${Math.min(i,20)*0.025}s`}} onClick={()=>openSurah(s)}>
          <div className="sn">{s.id}</div>
          <div className="si-info">
            <div className="si-name">{s.name}</div>
            <div className="si-meta">{s.type} • {s.ayat} آية</div>
          </div>
          <div className="si-arrow">←</div>
        </div>
      ))}
    </div>
  );
}

// ---- AZKAR ----
function Azkar({onComplete}) {
  const [tab, setTab] = useState("الصباح");
  const [counts, setCounts] = useState(()=>load("azkarCounts",{}));

  useEffect(()=>{ save("azkarCounts", counts); },[counts]);

  const tabKeys = Object.keys(AZKAR_FULL);
  const items = AZKAR_FULL[tab];

  const tap = (idx) => {
    const key = `${tab}_${idx}`;
    const max = items[idx].repeat;
    const cur = counts[key]||0;
    if (cur < max) {
      const newCur = cur+1;
      setCounts(c=>({...c,[key]:newCur}));
      if (newCur === max) onComplete();
    }
  };

  const resetTab = () => {
    const newC = {...counts};
    items.forEach((_,i)=>{ delete newC[`${tab}_${i}`]; });
    setCounts(newC);
  };

  const allDone = items.every((_,i)=>(counts[`${tab}_${i}`]||0)>=(items[i].repeat));

  return (
    <div className="main">
      <div className="page-title">الأذكار</div>
      <div className="tabs">
        {tabKeys.map(k=>(
          <button key={k} className={`tab ${tab===k?"on":""}`} onClick={()=>setTab(k)}>
            {k==="الصباح"?"🌅":k==="المساء"?"🌇":k==="النوم"?"🌙":"🕌"} {k}
          </button>
        ))}
      </div>
      {allDone && (
        <div style={{background:"rgba(34,197,94,.08)",border:"1px solid rgba(34,197,94,.2)",borderRadius:12,padding:"12px 16px",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{color:"#22c55e",fontWeight:800}}>✅ أتممت أذكار {tab}!</span>
          <button className="btn btn-ghost btn-sm" onClick={resetTab}>إعادة</button>
        </div>
      )}
      {items.map((z,i)=>{
        const key=`${tab}_${i}`;
        const cur=counts[key]||0;
        const done=cur>=z.repeat;
        const pct=(cur/z.repeat)*100;
        return (
          <div key={i} className={`zikr-card ${done?"done":""}`} style={{animationDelay:`${i*0.06}s`}}>
            <div className="zikr-text">{z.text}</div>
            <div className="zikr-footer">
              <div className="zikr-progress">
                <div className="zikr-count-text">{cur} / {z.repeat}</div>
                <div className="prog-wrap"><div className="prog-fill" style={{width:`${pct}%`}}></div></div>
              </div>
              {done
                ? <div className="zikr-done-icon">✅</div>
                : <button className="zikr-tap" onClick={()=>tap(i)}>+١</button>
              }
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Tasbih({onTasbih}) {
  const [preset, setPreset] = useState(0);
  const [count, setCount] = useState(0);
  const goal = TASBIH_PRESETS[preset].max;
  const pct = Math.min((count/goal)*100,100);
  const done = count>=goal;
  const circleRef = useRef(null);

  const tap = () => {
    if (!done) { setCount(c=>c+1); onTasbih(); }
    else { setCount(0); }
  };

  const changePreset = (i) => { setPreset(i); setCount(0); };

  return (
    <div className="main">
      <div className="page-title">المسبحة</div>
      <div className="preset-scroll">
        {TASBIH_PRESETS.map((p,i)=>(
          <button key={i} className={`preset-chip ${preset===i?"on":""}`} onClick={()=>changePreset(i)}>
            {p.label}

        ))}
      </div>
      <div className="tasbih-page">
        <div className="tasbih-label">{TASBIH_PRESETS[preset].label}</div>
        <div className="tasbih-outer" onClick={tap} ref={circleRef}>

          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--text3)",marginBottom:6}}>
            <span>التقدم</span><span>{Math.round(pct)}%</span>

          <button className="btn btn-ghost" onClick={()=>setCount(0)}>🔄 إعادة</button>
        </div>

  );

function Wird({stats, onWird}) {
  const today = new Date().toDateString();
  const [progress, setProgress] = useState(()=>load(`wird_${today}`,{}));
  useEffect(()=>{ save(`wird_${today}`, progress); },[progress]);

  const tap = (item) => {
    const cur = progress[item.id]||0;
    if (cur<item.target) { setProgress(p=>({...p,[item.id]:cur+1})); onWird(); }
  };
  const reset = (id) => setProgress(p=>({...p,[id]:0}));
  const totalDone = WARD_ITEMS.filter(w=>(progress[w.id]||0)>=w.target).length;

  return (
    <div className="main">
      <div className="page-title">الورد اليومي</div>
      <div className="page-sub">تتبع وردك لهذا اليوم</div>

      <div className="card" style={{padding:16,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontWeight:800}}>تقدم اليوم</span>
          <span className="badge">{totalDone}/{WARD_ITEMS.length}</span>
        </div>
        <div className="prog-wrap" style={{height:10}}>
          <div className="prog-fill" style={{width:`${(totalDone/WARD_ITEMS.length)*100}%`}}></div>
        </div>
        {totalDone===WARD_ITEMS.length && (
          <div style={{marginTop:10,fontSize:14,fontWeight:800,color:"#22c55e",textAlign:"center"}}>🎉 أتممت وردك اليوم!</div>
        )}
      </div>

      {WARD_ITEMS.map((item,i)=>{
        const cur = progress[item.id]||0;
        const pct = Math.min((cur/item.target)*100,100);
        const done = cur>=item.target;
        return (
          <div key={i} className="wird-card" style={{animationDelay:`${i*0.07}s`}}>
            <div className="wird-header">
              <span className="wird-title">{item.title}</span>
              {done && <span className="wird-done-badge">✅ مكتمل</span>}
            </div>
            <div className="wird-prog-text">{cur} / {item.target} {item.unit}</div>
            <div className="prog-wrap" style={{marginBottom:10}}>
              <div className="prog-fill" style={{width:`${pct}%`,background:done?"#22c55e":undefined}}></div>
            </div>
            <div style={{display:"flex",gap:8}}>
              {!done && <button className="btn btn-primary btn-sm" onClick={()=>tap(item)}>+١</button>}
              {cur>0 && <button className="btn btn-ghost btn-sm" onClick={()=>reset(item.id)}>إعادة</button>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ---- FAVORITES ----
function Favorites({favorites, toggleFav}) {
  const [tab, setTab] = useState("ayahs");
  const ayahKeys = favorites.ayahs ? Object.keys(favorites.ayahs) : [];
  const hadithKeys = favorites.hadiths ? Object.keys(favorites.hadiths) : [];

  return (
    <div className="main">
      <div className="page-title">المفضلة</div>
      <div className="tabs">
        <button className={`tab ${tab==="ayahs"?"on":""}`} onClick={()=>setTab("ayahs")}>⭐ الآيات ({ayahKeys.length})</button>
        <button className={`tab ${tab==="hadiths"?"on":""}`} onClick={()=>setTab("hadiths")}>📚 الأحاديث ({hadithKeys.length})</button>
      </div>

      {tab==="ayahs" && (
        ayahKeys.length===0
          ? <div style={{textAlign:"center",padding:"40px 0",color:"var(--text3)"}}>لا يوجد آيات محفوظة بعد</div>
          : ayahKeys.map(k=>{
              const item = favorites.ayahs[k];
              return (
                <div key={k} className="fav-card" style={{animation:"fadeUp .4s ease both"}}>
                  <div className="fav-type-badge">📖 سورة {item.surahName} — آية {item.ayahNum}</div>
                  <div style={{fontFamily:"'Amiri Quran',serif",fontSize:20,lineHeight:2,marginBottom:8}}>{item.text}</div>
                  <button className="btn btn-ghost btn-sm" onClick={()=>toggleFav("ayahs",k,null)}>🗑 حذف</button>
                </div>
              );
            })
      )}
      {tab==="hadiths" && (
        hadithKeys.length===0
          ? <div style={{textAlign:"center",padding:"40px 0",color:"var(--text3)"}}>لا يوجد أحاديث محفوظة بعد</div>
          : hadithKeys.map(k=>{
              const item = favorites.hadiths[k];
              return (
                <div key={k} className="fav-card" style={{animation:"fadeUp .4s ease both"}}>
                  <div className="fav-type-badge">📚 حديث شريف</div>
                  <div style={{fontFamily:"'Amiri',serif",fontSize:18,lineHeight:2,marginBottom:6}}>{item.text}</div>
                  <div style={{fontSize:12,color:"var(--g2)",marginBottom:8}}>— {item.source}</div>
                  <button className="btn btn-ghost btn-sm" onClick={()=>toggleFav("hadiths",k,null)}>🗑 حذف</button>
                </div>
              );
            })
      )}
    </div>
  );
}

// ---- STATS ----
function Stats({stats}) {
  const today = new Date().toDateString();
  const todayWird = load(`wird_${today}`,{});
  const wirdDone = WARD_ITEMS.filter(w=>(todayWird[w.id]||0)>=w.target).length;

  return (
    <div className="main">
      <div className="page-title">إحصائياتي</div>
      <div className="page-sub">متابعة رحلتك العبادية</div>

      <div className="stats-row">
        <div className="stat-box"><div className="stat-num">{stats.reads||0}</div><div className="stat-lbl">سور قُرأت</div></div>
        <div className="stat-box"><div className="stat-num">{stats.tasbih||0}</div><div className="stat-lbl">تسبيحة</div></div>
        <div className="stat-box"><div className="stat-num">{stats.azkar||0}</div><div className="stat-lbl">ذكر أُتمّ</div></div>
      </div>

      <div className="stat-detail">
        <div className="stat-detail-title">📊 ملخص العبادات</div>
        <div className="stat-row"><span className="stat-row-label">القرآن — سور قُرأت</span><span className="stat-row-val">{stats.reads||0}</span></div>
        <div className="stat-row"><span className="stat-row-label">المسبحة — إجمالي التسبيحات</span><span className="stat-row-val">{(stats.tasbih||0).toLocaleString("ar-SA")}</span></div>
        <div className="stat-row"><span className="stat-row-label">الأذكار — أذكار مكتملة</span><span className="stat-row-val">{stats.azkar||0}</span></div>
        <div className="stat-row"><span className="stat-row-label">الورد اليومي — اليوم</span><span className="stat-row-val">{wirdDone}/{WARD_ITEMS.length}</span></div>
        <div className="stat-row"><span className="stat-row-label">المفضلة — آيات</span><span className="stat-row-val">{stats.favAyahs||0}</span></div>
      </div>

      <div className="stat-detail">
        <div className="stat-detail-title">🎯 تقدم الورد اليومي</div>
        {WARD_ITEMS.map((w,i)=>{
          const cur = todayWird[w.id]||0;
          const pct = Math.min((cur/w.target)*100,100);
          return (
            <div key={i} style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}>
                <span style={{fontWeight:700}}>{w.title}</span>
                <span style={{color:"var(--g2)",fontWeight:800}}>{cur}/{w.target}</span>
              </div>
              <div className="prog-wrap">
                <div className="prog-fill" style={{width:`${pct}%`,background:pct>=100?"#22c55e":undefined}}></div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---- SETTINGS ----

  const colors = [
    {name:"th-default", color:"linear-gradient(135deg,#6366f1,#f59e0b)", label:"بنفسجي"},
    {name:"th-green",   color:"linear-gradient(135deg,#059669,#84cc16)", label:"أخضر"},
    {name:"th-gold",    color:"linear-gradient(135deg,#b45309,#fcd34d)", label:"ذهبي"},
    {name:"th-blue",    color:"linear-gradient(135deg,#0284c7,#38bdf8)", label:"أزرق"},
    {name:"th-rose",    color:"linear-gradient(135deg,#be185d,#f472b6)", label:"وردي"},
  ];

  return (
    <div className="main">
      <div className="page-title">الإعدادات</div>

      <div className="settings-group">

        <div className="card" style={{padding:16}}>

            {colors.map(c=>(
              <button key={c.name} title={c.label}
                className={`swatch ${themeColor===c.name?"selected":""}`}
                style={{background:c.color}}

            ))}
          </div>
          <div style={{fontSize:12,color:"var(--text3)",marginTop:8}}>اختر اللون المفضل لديك</div>
        </div>
      </div>

      <div className="settings-group">
        <div className="settings-label">القرآن الكريم</div>
        <div className="settings-row">
          <div className="settings-row-info">
            <div className="settings-row-icon">🌍</div>
            <div className="settings-row-text">
              <div className="sr-title">عرض الترجمة</div>
              <div className="sr-sub">تفسير مبسّط للآيات</div>
            </div>
          </div>
          <div className={`toggle ${showTranslate?"on":""}`} onClick={()=>setShowTranslate(v=>!v)}></div>
        </div>
      </div>

      <div className="settings-group">
        <div className="settings-label">عن التطبيق</div>
        <div className="card" style={{padding:16}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
            <div className="logo-star" style={{width:48,height:48,fontSize:24}}>✦</div>
            <div>
              <div style={{fontSize:18,fontWeight:900,background:"linear-gradient(135deg,var(--p2),var(--g2))",-WebkitBackgroundClip:"text",-WebkitTextFillColor:"transparent",backgroundClip:"text"}}>نور</div>
              <div style={{fontSize:12,color:"var(--text3)"}}>الإصدار 2.0</div>
            </div>
          </div>
          <div style={{fontSize:13,color:"var(--text2)",lineHeight:1.8}}>
            منصة إسلامية متكاملة تشمل القرآن الكريم بصوت القارئ العفاسي، الأذكار والأوراد، المسبحة الإلكترونية، الأحاديث النبوية، ومتابعة الورد اليومي.
          </div>
        </div>
      </div>
    </div>

/* ============================================================
   MAIN APP
   ============================================================ */
function App() {
  const [screen, setScreen] = useState("home");
  const [loading, setLoading] = useState(true);

  // Theme
  const [theme, setTheme] = useState(()=>load("noor_theme","dark"));
  const [themeColor, setThemeColor] = useState(()=>load("noor_color","th-default"));

  // Stats
  const [stats, setStats] = useState(()=>load("noor_stats",{reads:0,tasbih:0,azkar:0,favAyahs:0}));

  // Prayer times
  const [prayerTimes, setPrayerTimes] = useState(["--:--","--:--","--:--","--:--","--:--","--:--"]);
  const [prayerLoading, setPrayerLoading] = useState(true);
  const [cityName, setCityName] = useState("");
  const [geoError, setGeoError] = useState(false);

  // Favorites
  const [favorites, setFavorites] = useState(()=>load("noor_favs",{ayahs:{},hadiths:{}}));

  // Settings
  const [showTranslate, setShowTranslate] = useState(()=>load("showTranslate",true));

  // Apply theme
  useEffect(()=>{
    const base = theme==="dark"?"":"light";
    const color = themeColor==="th-default"?"":themeColor;
    document.body.className = [base,color].filter(Boolean).join(" ");
    save("noor_theme",theme); save("noor_color",themeColor);
  },[theme,themeColor]);

  useEffect(()=>{ save("noor_stats",stats); },[stats]);
  useEffect(()=>{ save("noor_favs",favorites); },[favorites]);

  // Loading splash
  useEffect(()=>{
    setTimeout(()=>{
      setLoading(false);
      if(window._finishLoader) window._finishLoader();
    },800);
  },[]);

  // Geo & prayer times
  const requestGeo = useCallback(()=>{
    setPrayerLoading(true); setGeoError(false);
    if (!navigator.geolocation) { setGeoError(true); setPrayerLoading(false); return; }
    navigator.geolocation.getCurrentPosition(
      async (pos)=>{
        const {latitude:lat, longitude:lng} = pos.coords;
        const times = calcPrayerTimes(lat,lng);
        setPrayerTimes(times);
        // Reverse geocode city name
        try {
          const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
          const d = await r.json();
          setCityName(d.address.city||d.address.town||d.address.state||"موقعك");
        } catch {}
        setPrayerLoading(false);
      },
      ()=>{ setGeoError(true); setPrayerLoading(false); }
    );
  },[]);

  useEffect(()=>{ requestGeo(); },[]);

  // Stat helpers
  const incReads = () => setStats(s=>({...s,reads:(s.reads||0)+1}));
  const incTasbih = () => setStats(s=>({...s,tasbih:(s.tasbih||0)+1}));
  const incAzkar = () => setStats(s=>({...s,azkar:(s.azkar||0)+1}));

  // Favorites
  const toggleFav = (type, key, data) => {
    setFavorites(f=>{
      const cat = {...(f[type]||{})};
      if (cat[key]) { delete cat[key]; }
      else if (data) { cat[key] = data; }
      const newFavs = {...f,[type]:cat};
      setStats(s=>({...s,favAyahs:Object.keys(newFavs.ayahs||{}).length}));
      return newFavs;
    });
  };

  // loading handled by pre-loader div

  const navItems = [
    {id:"home",   icon:"🏠", label:"الرئيسية"},
    {id:"quran",  icon:"📖", label:"القرآن"},
    {id:"azkar",  icon:"🌿", label:"الأذكار"},
    {id:"tasbih", icon:"📿", label:"المسبحة"},
    {id:"wird",   icon:"🗓", label:"الورد"},
  ];

  return (
    <>
      <Header screen={screen} theme={theme} toggleTheme={()=>setTheme(t=>t==="dark"?"light":"dark")} setScreen={setScreen}/>

      {screen==="home"      && <Home setScreen={setScreen} stats={stats} prayerTimes={prayerTimes} prayerLoading={prayerLoading} cityName={cityName} geoError={geoError} requestGeo={requestGeo}/>}
      {screen==="quran"     && <Quran favorites={favorites} toggleFav={toggleFav} onRead={incReads}/>}
      {screen==="azkar"     && <Azkar onComplete={incAzkar}/>}
      {screen==="tasbih"    && <Tasbih onTasbih={incTasbih}/>}
      {screen==="hadith"    && <Hadith favorites={favorites} toggleFav={toggleFav}/>}
      {screen==="wird"      && <Wird stats={stats} onWird={()=>{}}/>}
      {screen==="favorites" && <Favorites favorites={favorites} toggleFav={toggleFav}/>}
      {screen==="stats"     && <Stats stats={stats}/>}
      {screen==="settings"  && <Settings theme={theme} toggleTheme={()=>setTheme(t=>t==="dark"?"light":"dark")} themeColor={themeColor} setThemeColor={setThemeColor} showNotif={false} setShowNotif={()=>{}} showTranslate={showTranslate} setShowTranslate={setShowTranslate}/>}

      <div className="nav">
        {navItems.map(n=>(
          <button key={n.id} className={`nav-btn ${screen===n.id?"on":""}`} onClick={()=>setScreen(n.id)}>
            <span className="ni">{n.icon}</span>
            <span>{n.label}</span>
          </button>
        ))}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
