<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>نور | منصة إسلامية متكاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f;--bg2:#0d1117;--card:#111827;--card2:#162033;
  --b1:rgba(99,102,241,.15);--b2:rgba(255,255,255,.06);
  --t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;
  --p1:#6366f1;--p2:#818cf8;--g1:#f59e0b;--g2:#fbbf24;
  --r:16px;
}
.th-green{--p1:#059669;--p2:#34d399;--g1:#84cc16;--g2:#a3e635;}
.th-gold {--p1:#b45309;--p2:#d97706;--g1:#92400e;--g2:#fcd34d;}
.th-blue {--p1:#0284c7;--p2:#38bdf8;--g1:#0369a1;--g2:#7dd3fc;}
.th-rose {--p1:#be185d;--p2:#f472b6;--g1:#9d174d;--g2:#fbcfe8;}
.light  {--bg:#f8faff;--bg2:#eef2ff;--card:#fff;--card2:#f0f4ff;--b2:rgba(0,0,0,.06);--t1:#1e1b4b;--t2:#4c1d95;--t3:#6d28d9;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--t1);font-family:'Tajawal',sans-serif;min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden;}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.1;}
.orb1{width:400px;height:400px;background:var(--p1);top:-100px;right:-100px;animation:fl 14s ease-in-out infinite;}
.orb2{width:300px;height:300px;background:var(--g1);bottom:-80px;left:-80px;animation:fl 14s ease-in-out infinite reverse;}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-28px)}}
.light .orb{opacity:.05;}
#app{position:relative;z-index:1;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--p1);border-radius:4px;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(7,9,15,.85);backdrop-filter:blur(20px);position:sticky;top:0;z-index:500;border-bottom:1px solid var(--b2);}
.light .hdr{background:rgba(248,250,255,.9);}
.logo{display:flex;align-items:center;gap:8px;}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--p1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 18px rgba(99,102,241,.3);}
.logo-txt{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--p2),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hdr-btns{display:flex;gap:6px;}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--b1);background:var(--card2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.2s;}
.ibtn:hover{transform:scale(1.08);border-color:var(--p1);}
.main{padding:14px 14px 90px;max-width:600px;margin:0 auto;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid var(--b2);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 2px 20px rgba(0,0,0,.3);animation:fadeUp .4s ease both;transition:.22s;}
.card:hover{transform:translateY(-2px);border-color:var(--b1);}
.card-inner{background:var(--card2);border-radius:12px;padding:12px;border:1px solid var(--b2);margin-bottom:12px;}
.grad{background:linear-gradient(135deg,var(--p2),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ptitle{font-size:22px;font-weight:900;margin-bottom:4px;}
.psub{font-size:13px;color:var(--t3);margin-bottom:16px;}
.slbl{font-size:11px;font-weight:800;color:var(--t3);letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.slbl::after{content:'';flex:1;height:1px;background:var(--b2);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:12px;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;transition:.2s;}
.btn-p{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;}
.btn-p:hover{opacity:.88;transform:translateY(-1px);}
.btn-g{background:transparent;border:1px solid var(--b1);color:var(--t2);}
.btn-g:hover{border-color:var(--p1);color:var(--p2);}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:10px;}
.btn-back{background:none;border:none;color:var(--p2);font-weight:700;font-size:14px;cursor:pointer;padding:7px 12px;border-radius:10px;display:inline-flex;align-items:center;gap:5px;font-family:'Tajawal',sans-serif;margin-bottom:14px;transition:.2s;}
.btn-back:hover{background:rgba(99,102,241,.1);}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.tab{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid var(--b1);background:var(--card2);color:var(--t3);cursor:pointer;transition:.2s;font-family:'Tajawal',sans-serif;}
.tab.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent;}
.search{width:100%;padding:12px 16px;background:var(--card);border:1px solid var(--b2);border-radius:12px;color:var(--t1);font-family:'Tajawal',sans-serif;font-size:14px;outline:none;transition:.3s;margin-bottom:14px;}
.search::placeholder{color:var(--t3);}
.search:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(99,102,241,.1);}
.prog{height:6px;background:var(--card2);border-radius:6px;overflow:hidden;}
.prog-f{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--p1),var(--g2));transition:width .4s;}
.badge{display:inline-flex;align-items:center;justify-content:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff;}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:rgba(11,14,22,.93);backdrop-filter:blur(22px);padding:8px 4px 18px;border-top:1px solid var(--b2);z-index:500;}
.light .nav{background:rgba(248,250,255,.94);}
.nbtn{background:none;border:none;color:var(--t3);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:5px 10px;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:700;transition:.2s;}
.nbtn .ni{font-size:22px;line-height:1;}
.nbtn.on{color:var(--g2);}
.spinner{width:36px;height:36px;border:3px solid var(--b1);border-top-color:var(--p2);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;display:block;}
.greeting{padding:18px 0 14px;animation:fadeUp .35s ease both;}
.hijri{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--b1);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--g2);margin-top:8px;}
.hdth-banner{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f0a2a,#0d1117);border:1px solid rgba(245,200,66,.2);border-radius:var(--r);padding:18px;margin-bottom:12px;animation:fadeUp .38s ease both;}
.light .hdth-banner{background:linear-gradient(135deg,#ede9fe,#f5f3ff);}
.hdth-banner::before{content:'"\u275d"';position:absolute;left:10px;top:0;font-size:80px;opacity:.06;color:var(--g2);font-family:serif;line-height:1;}
.hdth-tag{font-size:11px;font-weight:800;color:var(--g2);letter-spacing:1px;margin-bottom:8px;}
.hdth-txt{font-family:'Amiri',serif;font-size:18px;line-height:2;}
.hdth-src{font-size:12px;color:var(--g1);font-weight:700;margin-top:8px;padding-top:8px;border-top:1px solid rgba(245,200,66,.12);}
.pray-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pcell{background:var(--card2);border:1px solid var(--b2);border-radius:12px;padding:10px 8px;text-align:center;transition:.2s;}
.pcell.next{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(245,200,66,.08));border-color:var(--g2);}
.pcell .pn{font-size:12px;font-weight:800;color:var(--t2);margin:4px 0 2px;}
.pcell .pt{font-size:15px;font-weight:900;color:var(--g2);}
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fcrd{background:var(--card);border:1px solid var(--b2);border-radius:var(--r);padding:20px 14px;text-align:center;cursor:pointer;transition:.25s;animation:fadeUp .4s ease both;position:relative;overflow:hidden;}
.fcrd:hover{transform:translateY(-4px);border-color:var(--p1);box-shadow:0 12px 40px rgba(0,0,0,.3);}
.fcrd .fi{font-size:36px;margin-bottom:8px;}
.fcrd .fl{font-size:15px;font-weight:800;}
.fcrd .fd{font-size:11px;color:var(--t3);margin-top:2px;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.sbox{background:var(--card2);border:1px solid var(--b2);border-radius:12px;padding:14px 10px;text-align:center;}
.snum{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--p2),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.slb{font-size:11px;color:var(--t3);font-weight:700;margin-top:2px;}
.si{display:flex;align-items:center;gap:12px;cursor:pointer;padding:14px 16px;background:var(--card);border:1px solid var(--b2);border-radius:14px;margin-bottom:8px;transition:.2s;animation:fadeUp .4s ease both;}
.si:hover{border-color:var(--p1);transform:translateX(-3px);}
.snum2{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;}
.si-name{font-size:16px;font-weight:800;}
.si-meta{font-size:12px;color:var(--t3);margin-top:2px;}
.ayah-wrap{background:var(--card2);border:1px solid var(--b2);border-radius:14px;padding:16px;margin-bottom:10px;animation:fadeUp .38s ease both;}
.ayah-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.anum{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.aact{display:flex;gap:6px;}
.aabtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--b2);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.2s;}
.aabtn:hover{border-color:var(--p1);}
.aabtn.fav{border-color:var(--g2);color:var(--g2);}
.ayah-ar{font-family:'Amiri',serif;text-align:right;line-height:2.2;}
.ayah-tr{font-size:13px;color:var(--t2);margin-top:10px;padding-top:10px;border-top:1px solid var(--b2);line-height:1.8;}
.fc-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.fsbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--b1);background:var(--card2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;transition:.2s;color:var(--t1);}
.fsbtn:hover{border-color:var(--p1);color:var(--p2);}
.zcrd{background:var(--card);border:1px solid var(--b2);border-radius:14px;padding:16px;margin-bottom:10px;animation:fadeUp .4s ease both;transition:.2s;}
.zcrd.done{opacity:.45;}
.ztxt{font-family:'Amiri',serif;font-size:18px;line-height:2;margin-bottom:10px;}
.zfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ztap{background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff;border:none;border-radius:12px;padding:8px 18px;font-family:'Tajawal',sans-serif;font-weight:800;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;}
.ztap:active{transform:scale(.95);}
.tpage{text-align:center;padding-top:8px;}
.pscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none;}
.pscroll::-webkit-scrollbar{display:none;}
.pchip{white-space:nowrap;padding:7px 16px;border-radius:20px;border:1px solid var(--b1);background:var(--card2);color:var(--t3);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;font-family:'Tajawal',sans-serif;}
.pchip.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent;}
.tcircle{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--card2),var(--bg2));border:3px solid var(--g2);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(99,102,241,.12),inset 0 0 40px rgba(0,0,0,.2);cursor:pointer;margin:0 auto 16px;transition:transform .1s;user-select:none;}
.tcircle:active{transform:scale(.95);}
.tnum{font-size:60px;font-weight:900;color:var(--g2);line-height:1;}
.tsub{font-size:13px;color:var(--t3);margin-top:4px;}
.hcrd{background:var(--card);border:1px solid var(--b2);border-radius:var(--r);padding:20px;margin-bottom:12px;position:relative;overflow:hidden;animation:fadeUp .4s ease both;}
.hcrd::before{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:linear-gradient(to bottom,var(--p1),var(--g2));}
.hidx{font-size:11px;font-weight:800;color:var(--p2);letter-spacing:1px;margin-bottom:8px;}
.htxt{font-family:'Amiri',serif;font-size:19px;line-height:2;margin-bottom:10px;}
.hfoot{display:flex;align-items:center;justify-content:space-between;}
.hsrc{font-size:12px;color:var(--g2);font-weight:700;background:rgba(245,200,66,.08);padding:4px 12px;border-radius:20px;border:1px solid rgba(245,200,66,.2);}
.wcrd{background:var(--card);border:1px solid var(--b2);border-radius:14px;padding:16px;margin-bottom:10px;animation:fadeUp .4s ease both;}
.whdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.wtitle{font-size:15px;font-weight:800;}
.wdone{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.2);}
.favcrd{background:var(--card);border:1px solid rgba(245,200,66,.15);border-radius:14px;padding:16px;margin-bottom:10px;animation:fadeUp .4s ease both;}
.favtype{font-size:11px;font-weight:800;color:var(--g2);margin-bottom:8px;}
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border:1px solid var(--b2);border-radius:12px;margin-bottom:6px;}
.srow-l{display:flex;align-items:center;gap:10px;}
.sr-icon{font-size:20px;}
.sr-title{font-size:14px;font-weight:700;}
.sr-sub{font-size:12px;color:var(--t3);margin-top:1px;}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--card2);border:1px solid var(--b1);cursor:pointer;position:relative;transition:.3s;}
.toggle.on{background:linear-gradient(135deg,var(--p1),var(--p2));}
.toggle::after{content:'';position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.toggle.on::after{right:calc(100% - 19px);}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.2s;}
.swatch.on{border-color:var(--t1);}
#loader{position:fixed;inset:0;background:#07090f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9999;}
.lstar{font-size:52px;animation:fl 1.2s ease-in-out infinite alternate;}
.ltxt{font-size:21px;font-weight:900;background:linear-gradient(135deg,#818cf8,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.lsub{font-size:13px;color:#64748b;}
.lbar{width:160px;height:4px;background:#1e293b;border-radius:4px;overflow:hidden;margin-top:6px;}
.lbar-f{height:100%;width:0;background:linear-gradient(90deg,#6366f1,#fbbf24);border-radius:4px;transition:width .4s;}
</style>
</head>

</div>
<div class="orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div id="app"></div>

  var eqt=L/15-Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam))*12/Math.PI;
  var latR=lat*Math.PI/180;
  var noon=12-eqt+(lng-tz*15)/15*(-1);

  var fmt=function(v){var hh=Math.floor(v),mm=Math.round((v-hh)*60);return(hh<10?"0"+hh:hh)+":"+(mm<10?"0"+mm:mm);};
  var sr=ha(-0.8333);
  var asrH=Math.acos((Math.sin(Math.atan(1+Math.tan(Math.abs(latR-decl))))-Math.sin(latR)*Math.sin(decl))/(Math.cos(latR)*Math.cos(decl)))*180/Math.PI/15;

}

      return h("div",{key:i,className:"wcrd",style:{animationDelay:(i*0.07)+"s"}},
        h("div",{className:"whdr"},h("span",{className:"wtitle"},item.title),isDone&&h("span",{className:"wdone"},"\u2705 \u0645\u0643\u062a\u0645\u0644")),
        h("div",{style:{fontSize:12,color:"var(--t3)",marginBottom:6,fontWeight:700}},cur+" / "+item.target),
        h("div",{className:"prog",style:{marginBottom:10}},h("div",{className:"prog-f",style:{width:pct+"%",background:isDone?"#22c55e":undefined}})),
        h("div",{style:{display:"flex",gap:8}},
          !isDone&&h("button",{className:"btn btn-p btn-sm",onClick:function(){tap(item);}},"\u200F+ \u0661"),
          cur>0&&h("button",{className:"btn btn-g btn-sm",onClick:function(){rst(item.id);}},"\u0625\u0639\u0627\u062f\u0629")
        )
      );
    })
  );
}

function Favorites(p){
  var s1=useState("ayahs"),tab=s1[0],setTab=s1[1];
  var aks=Object.keys(p.favs.ayahs||{});
  var hks=Object.keys(p.favs.hadiths||{});
  return h("div",{className:"main"},
    h("div",{className:"ptitle grad"},"\u0627\u0644\u0645\u0641\u0636\u0644\u0629"),
    h("div",{className:"tabs"},
      h("button",{className:"tab"+(tab==="ayahs"?" on":""),onClick:function(){setTab("ayahs");}},"\u2B50 \u0627\u0644\u0622\u064a\u0627\u062a ("+aks.length+")"),
      h("button",{className:"tab"+(tab==="hadiths"?" on":""),onClick:function(){setTab("hadiths");}},"\uD83D\uDCDA \u0627\u0644\u0623\u062d\u0627\u062f\u064a\u062b ("+hks.length+")")
    ),
    tab==="ayahs"&&(aks.length===0
      ?h("div",{style:{textAlign:"center",padding:"40px 0",color:"var(--t3)"}},"\u0644\u0627 \u064a\u0648\u062c\u062f \u0622\u064a\u0627\u062a \u0645\u062d\u0641\u0648\u0638\u0629 \u0628\u0639\u062f")
      :aks.map(function(k){var item=p.favs.ayahs[k];return h("div",{key:k,className:"favcrd"},h("div",{className:"favtype"},"\uD83D\uDCD6 "+item.surahName+" \u2014 \u0622\u064a\u0629 "+item.ayahNum),h("div",{style:{fontFamily:"'Amiri',serif",fontSize:20,lineHeight:2,marginBottom:8}},item.text),h("button",{className:"btn btn-g btn-sm",onClick:function(){p.togFav("ayahs",k,null);}},"\uD83D\uDDD1 \u062d\u0630\u0641"));})
    ),
    tab==="hadiths"&&(hks.length===0
      ?h("div",{style:{textAlign:"center",padding:"40px 0",color:"var(--t3)"}},"\u0644\u0627 \u064a\u0648\u062c\u062f \u0623\u062d\u0627\u062f\u064a\u062b \u0645\u062d\u0641\u0648\u0638\u0629 \u0628\u0639\u062f")
      :hks.map(function(k){var item=p.favs.hadiths[k];return h("div",{key:k,className:"favcrd"},h("div",{className:"favtype"},"\uD83D\uDCDA \u062d\u062f\u064a\u062b \u0634\u0631\u064a\u0641"),h("div",{style:{fontFamily:"'Amiri',serif",fontSize:18,lineHeight:2,marginBottom:6}},item.text),h("div",{style:{fontSize:12,color:"var(--g2)",marginBottom:8}},"\u2014 "+item.source),h("button",{className:"btn btn-g btn-sm",onClick:function(){p.togFav("hadiths",k,null);}},"\uD83D\uDDD1 \u062d\u0630\u0641"));})
    )
  );
}

function Stats(p){
  var today=new Date().toDateString(),wp=ld("wird_"+today,{});
  var wd=WIRD_ITEMS.filter(function(w){return(wp[w.id]||0)>=w.target;}).length;
  return h("div",{className:"main"},
    h("div",{className:"ptitle grad"},"\u0625\u062d\u0635\u0627\u0626\u064a\u0627\u062a\u064a"),
    h("div",{className:"stats-row"},
      [{n:p.stats.reads||0,l:"\u0633\u0648\u0631 \u0642\u064f\u0631\u0626\u062a"},{n:p.stats.tasbih||0,l:"\u062a\u0633\u0628\u064a\u062d\u0629"},{n:p.stats.azkar||0,l:"\u0630\u0643\u0631 \u0623\u064f\u062a\u0645\u0651"}].map(function(s,i){
        return h("div",{key:i,className:"sbox"},h("div",{className:"snum"},s.n),h("div",{className:"slb"},s.l));
      })
    ),
    h("div",{className:"card-inner"},
      h("div",{style:{fontSize:14,fontWeight:800,color:"var(--p2)",marginBottom:12}},"\uD83D\uDCCA \u0645\u0644\u062e\u0635"),
      [
        ["\u0627\u0644\u0642\u0631\u0622\u0646 \u2014 \u0633\u0648\u0631 \u0642\u064f\u0631\u0626\u062a",p.stats.reads||0],
        ["\u0627\u0644\u0645\u0633\u0628\u062d\u0629 \u2014 \u0625\u062c\u0645\u0627\u0644\u064a",(p.stats.tasbih||0).toLocaleString("ar-SA")],
        ["\u0627\u0644\u0623\u0630\u0643\u0627\u0631 \u2014 \u0623\u0630\u0643\u0627\u0631 \u0645\u0643\u062a\u0645\u0644\u0629",p.stats.azkar||0],
        ["\u0627\u0644\u0648\u0631\u062f \u0627\u0644\u064a\u0648\u0645\u064a",wd+"/"+WIRD_ITEMS.length],
        ["\u0627\u0644\u0645\u0641\u0636\u0644\u0629 \u2014 \u0622\u064a\u0627\u062a",p.stats.favAyahs||0],
      ].map(function(row,i){
        return h("div",{key:i,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:i<4?"1px solid var(--b2)":"none"}},
          h("span",{style:{fontSize:13,color:"var(--t2)"}},row[0]),h("span",{style:{fontSize:14,fontWeight:800,color:"var(--g2)"}},row[1])
        );
      })
    )
  );
}

function Settings(p){
  var colors=[
    {cls:"",bg:"linear-gradient(135deg,#6366f1,#fbbf24)",l:"\u0628\u0646\u0641\u0633\u062c\u064a"},
    {cls:"th-green",bg:"linear-gradient(135deg,#059669,#a3e635)",l:"\u0623\u062e\u0636\u0631"},
    {cls:"th-gold",bg:"linear-gradient(135deg,#b45309,#fcd34d)",l:"\u0630\u0647\u0628\u064a"},
    {cls:"th-blue",bg:"linear-gradient(135deg,#0284c7,#7dd3fc)",l:"\u0623\u0632\u0631\u0642"},
    {cls:"th-rose",bg:"linear-gradient(135deg,#be185d,#fbcfe8)",l:"\u0648\u0631\u062f\u064a"},
  ];
  return h("div",{className:"main"},
    h("div",{className:"ptitle grad"},"\u0627\u0644\u0625\u0639\u062f\u0627\u062f\u0627\u062a"),
    h("div",{style:{marginBottom:16}},
      h("div",{style:{fontSize:11,fontWeight:800,color:"var(--t3)",letterSpacing:"1.5px",marginBottom:10}},"\u0627\u0644\u0645\u0638\u0647\u0631"),
      h("div",{className:"srow"},
        h("div",{className:"srow-l"},h("div",{className:"sr-icon"},p.theme==="dark"?"\uD83C\uDF19":"\u2600\uFE0F"),h("div",null,h("div",{className:"sr-title"},"\u0627\u0644\u0648\u0636\u0639 \u0627\u0644\u0644\u064a\u0644\u064a"),h("div",{className:"sr-sub"},p.theme==="dark"?"\u0645\u0641\u0639\u0651\u0644":"\u0645\u0639\u0637\u0651\u0644"))),
        h("div",{className:"toggle"+(p.theme==="dark"?" on":""),onClick:p.toggleTheme})
      )
    ),
    h("div",{style:{marginBottom:16}},
      h("div",{style:{fontSize:11,fontWeight:800,color:"var(--t3)",letterSpacing:"1.5px",marginBottom:10}},"\u0644\u0648\u0646 \u0627\u0644\u062a\u0637\u0628\u064a\u0642"),
      h("div",{className:"card",style:{padding:16}},
        h("div",{className:"swatches"},
          colors.map(function(c,i){return h("button",{key:i,className:"swatch"+(p.color===c.cls?" on":""),title:c.l,style:{background:c.bg},onClick:function(){p.setColor(c.cls);}});})
        ),
        h("div",{style:{fontSize:12,color:"var(--t3)",marginTop:8}},"\u0627\u062e\u062a\u0631 \u0644\u0648\u0646 \u0627\u0644\u062a\u0637\u0628\u064a\u0642 \u0627\u0644\u0645\u0641\u0636\u0644")
      )
    ),
    h("div",{className:"card",style:{padding:16}},
      h("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:10}},
        h("div",{className:"logo-icon",style:{width:48,height:48,fontSize:24}},"\u2736"),
        h("div",null,h("div",{className:"logo-txt",style:{fontSize:18}},"\u0646\u0648\u0631"),h("div",{style:{fontSize:12,color:"var(--t3)"}},"\u0627\u0644\u0625\u0635\u062f\u0627\u0631 2.0"))
      ),
      h("div",{style:{fontSize:13,color:"var(--t2)",lineHeight:1.8}},"\u0645\u0646\u0635\u0629 \u0625\u0633\u0644\u0627\u0645\u064a\u0629 \u0645\u062a\u0643\u0627\u0645\u0644\u0629: \u0627\u0644\u0642\u0631\u0622\u0646\u060c \u0627\u0644\u0623\u0630\u0643\u0627\u0631\u060c \u0627\u0644\u0645\u0633\u0628\u062d\u0629\u060c \u0627\u0644\u0623\u062d\u0627\u062f\u064a\u062b\u060c \u0627\u0644\u0648\u0631\u062f \u0627\u0644\u064a\u0648\u0645\u064a.")
    )
  );
}

/* ===================== APP ===================== */
function App(){
  var s1=useState("home"),screen=s1[0],setScreen=s1[1];
  var s2=useState(function(){return ld("noor_t","dark");}),theme=s2[0],setTheme=s2[1];
  var s3=useState(function(){return ld("noor_c","");}),color=s3[0],setColor=s3[1];
  var s4=useState(function(){return ld("noor_s",{reads:0,tasbih:0,azkar:0,favAyahs:0});}),stats=s4[0],setStats=s4[1];
  var s5=useState(function(){return ld("noor_f",{ayahs:{},hadiths:{}});}),favs=s5[0],setFavs=s5[1];
  var s6=useState(["--:--","--:--","--:--","--:--","--:--","--:--"]),pTimes=s6[0],setPTimes=s6[1];
  var s7=useState(true),pLoad=s7[0],setPLoad=s7[1];
  var s8=useState(false),pErr=s8[0],setPErr=s8[1];
  var s9=useState(""),city=s9[0],setCity=s9[1];

  useEffect(function(){
    var cls=[theme==="dark"?"":"light",color].filter(Boolean).join(" ");
    document.body.className=cls;
    sv("noor_t",theme);sv("noor_c",color);
  },[theme,color]);
  useEffect(function(){sv("noor_s",stats);},[stats]);
  useEffect(function(){sv("noor_f",favs);},[favs]);
  useEffect(function(){hideLoader();},[]);

  function reqGeo(){
    setPLoad(true);setPErr(false);
    if(!navigator.geolocation){setPErr(true);setPLoad(false);return;}
    navigator.geolocation.getCurrentPosition(
      function(pos){
        var lat=pos.coords.latitude,lng=pos.coords.longitude;
        setPTimes(calcPrayers(lat,lng));
        fetch("https://nominatim.openstreetmap.org/reverse?lat="+lat+"&lon="+lng+"&format=json")
          .then(function(r){return r.json();})
          .then(function(d){setCity(d.address.city||d.address.town||d.address.state||"");})
          .catch(function(){});
        setPLoad(false);
      },
      function(){setPErr(true);setPLoad(false);}
    );
  }
  useEffect(function(){reqGeo();},[]);

  function toggleTheme(){setTheme(function(t){return t==="dark"?"light":"dark";});}
  function incReads(){setStats(function(s){var o=Object.assign({},s);o.reads=(s.reads||0)+1;return o;});}
  function incTasbih(){setStats(function(s){var o=Object.assign({},s);o.tasbih=(s.tasbih||0)+1;return o;});}
  function incAzkar(){setStats(function(s){var o=Object.assign({},s);o.azkar=(s.azkar||0)+1;return o;});}
  function togFav(type,key,data){
    setFavs(function(f){
      var cat=Object.assign({},f[type]||{});
      if(cat[key])delete cat[key];else if(data)cat[key]=data;
      var nf=Object.assign({},f);nf[type]=cat;
      setStats(function(s){var o=Object.assign({},s);o.favAyahs=Object.keys(nf.ayahs||{}).length;return o;});
      return nf;
    });
  }

  var navItems=[
    {id:"home",icon:"\uD83C\uDFE0",l:"\u0627\u0644\u0631\u0626\u064a\u0633\u064a\u0629"},
    {id:"quran",icon:"\uD83D\uDCD6",l:"\u0627\u0644\u0642\u0631\u0622\u0646"},
    {id:"azkar",icon:"\uD83C\uDF3F",l:"\u0627\u0644\u0623\u0630\u0643\u0627\u0631"},
    {id:"tasbih",icon:"\uD83D\uDCFF",l:"\u0627\u0644\u0645\u0633\u0628\u062d\u0629"},
    {id:"wird",icon:"\uD83D\uDDD3",l:"\u0627\u0644\u0648\u0631\u062f"},
  ];

  return h(React.Fragment,null,
    h(Header,{screen:screen,theme:theme,toggleTheme:toggleTheme,go:setScreen}),
    screen==="home"     &&h(Home,   {go:setScreen,stats:stats,pTimes:pTimes,pLoading:pLoad,pError:pErr,city:city,reqGeo:reqGeo}),
    screen==="quran"    &&h(Quran,  {favs:favs,togFav:togFav,onRead:incReads}),
    screen==="azkar"    &&h(Azkar,  {onDone:incAzkar}),
    screen==="tasbih"   &&h(Tasbih, {onTap:incTasbih}),
    screen==="hadith"   &&h(Hadith, {favs:favs,togFav:togFav}),
    screen==="wird"     &&h(Wird,   null),
    screen==="favorites"&&h(Favorites,{favs:favs,togFav:togFav}),
    screen==="stats"    &&h(Stats,  {stats:stats}),
    screen==="settings" &&h(Settings,{theme:theme,toggleTheme:toggleTheme,color:color,setColor:setColor}),
    h("div",{className:"nav"},
      navItems.map(function(n){
        return h("button",{key:n.id,className:"nbtn"+(screen===n.id?" on":""),onClick:function(){setScreen(n.id);}},
          h("span",{className:"ni"},n.icon),h("span",null,n.l)
        );
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(h(App,null));
})();
</script>
</body>
</html>
