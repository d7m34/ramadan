<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>نور | منصة إسلامية متكاملة</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Amiri&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0f172a;
--card:#1e293b;
--primary:#6366f1;
--gold:#facc15;
--text:#ffffff;
--radius:16px;
}

.light{
--bg:#f1f5f9;
--card:#ffffff;
--text:#111827;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:'Cairo',sans-serif;
transition:.3s;
}

.header{
padding:30px 20px;
text-align:center;
font-weight:800;
font-size:22px;
}

.card{
background:var(--card);
margin:12px;
padding:16px;
border-radius:var(--radius);
box-shadow:0 4px 20px rgba(0,0,0,0.2);
transition:.3s;
}

.card:hover{
transform:translateY(-4px);
}

.button{
background:linear-gradient(135deg,var(--primary),var(--gold));
border:none;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:700;
margin-top:10px;
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
background:var(--card);
padding:10px 0;
border-top:1px solid rgba(255,255,255,0.1);
}

.nav button{
background:none;
border:none;
color:var(--text);
font-size:12px;
cursor:pointer;
opacity:.6;
}

.nav button.active{
opacity:1;
color:var(--gold);
}

.main{
padding-bottom:80px;
}

.ayah{
font-family:'Amiri',serif;
font-size:22px;
line-height:2;
text-align:center;
}

input{
padding:8px;
width:90%;
border-radius:8px;
border:none;
margin:10px;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ----------------------- بيانات مبدئية ----------------------- */

const SURAHS = [
{ id:1,name:"الفاتحة"},
{ id:112,name:"الإخلاص"},
{ id:113,name:"الفلق"},
{ id:114,name:"الناس"}
];

const QURAN_SAMPLE = {
1:["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
"الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
"الرَّحْمَٰنِ الرَّحِيمِ"],
112:["قُلْ هُوَ اللَّهُ أَحَدٌ",
"اللَّهُ الصَّمَدُ"]
};

const AZKAR = [
{title:"أذكار الصباح",items:["أصبحنا وأصبح الملك لله","اللهم بك أصبحنا"]},
{title:"أذكار المساء",items:["أمسينا وأمسى الملك لله","اللهم بك أمسينا"]},
];

const HADITH = [
"إنما الأعمال بالنيات",
"الدين النصيحة",
"لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه"
];

/* ----------------------- الشاشات ----------------------- */

function Home({setScreen}){
return(
<div className="main">
<div className="header">نور - منصة إسلامية متكاملة</div>

<div className="card">
<h3>القرآن الكريم</h3>
<button className="button" onClick={()=>setScreen("quran")}>دخول</button>
</div>

<div className="card">
<h3>الأذكار</h3>
<button className="button" onClick={()=>setScreen("azkar")}>عرض</button>
</div>

<div className="card">
<h3>الأحاديث</h3>
<button className="button" onClick={()=>setScreen("hadith")}>قراءة</button>
</div>

<div className="card">
<h3>المسبحة</h3>
<button className="button" onClick={()=>setScreen("tasbih")}>فتح</button>
</div>
</div>
);
}

function Quran(){
const [search,setSearch]=useState("");
const [selected,setSelected]=useState(null);

if(selected){
return(
<div className="main">
<div className="header">{selected.name}</div>
<div className="card">
{(QURAN_SAMPLE[selected.id]||["(أضف المصحف الكامل لاحقًا)"]).map((a,i)=>(
<p key={i} className="ayah">{a}</p>
))}
</div>
<button className="button" onClick={()=>setSelected(null)}>رجوع</button>
</div>
);
}

return(
<div className="main">
<div className="header">القرآن الكريم</div>
<input placeholder="بحث عن سورة..." onChange={e=>setSearch(e.target.value)}/>
{SURAHS.filter(s=>s.name.includes(search)).map(s=>(
<div key={s.id} className="card" onClick={()=>setSelected(s)}>
{s.name}
</div>
))}
</div>
);
}

function Azkar(){
return(
<div className="main">
<div className="header">الأذكار</div>
{AZKAR.map((z,i)=>(
<div key={i} className="card">
<h4>{z.title}</h4>
{z.items.map((item,j)=>(
<p key={j}>{item}</p>
))}
</div>
))}
</div>
);
}

function Hadith(){
return(
<div className="main">
<div className="header">الأحاديث</div>
{HADITH.map((h,i)=>(
<div key={i} className="card">{h}</div>
))}
</div>
);
}

function Tasbih(){
const [count,setCount]=useState(
parseInt(localStorage.getItem("tasbih"))||0
);

useEffect(()=>{
localStorage.setItem("tasbih",count);
},[count]);

return(
<div className="main">
<div className="header">المسبحة الإلكترونية</div>
<div className="card" style={{textAlign:"center",fontSize:40}}>
{count}
</div>
<div style={{textAlign:"center"}}>
<button className="button" onClick={()=>setCount(count+1)}>تسبيح</button>
<button className="button" onClick={()=>setCount(0)}>إعادة</button>
</div>
</div>
);
}

/* ----------------------- التطبيق ----------------------- */

function App(){
const [screen,setScreen]=useState("home");
const [theme,setTheme]=useState(
localStorage.getItem("theme")||"dark"
);

useEffect(()=>{
document.body.className=theme==="light"?"light":"";
localStorage.setItem("theme",theme);
},[theme]);

return(
<>
{screen==="home" && <Home setScreen={setScreen}/>}
{screen==="quran" && <Quran/>}
{screen==="azkar" && <Azkar/>}
{screen==="hadith" && <Hadith/>}
{screen==="tasbih" && <Tasbih/>}

<div className="nav">
<button className={screen==="home"?"active":""} onClick={()=>setScreen("home")}>الرئيسية</button>
<button className={screen==="quran"?"active":""} onClick={()=>setScreen("quran")}>القرآن</button>
<button className={screen==="azkar"?"active":""} onClick={()=>setScreen("azkar")}>الأذكار</button>
<button onClick={()=>setTheme(theme==="dark"?"light":"dark")}>🌓</button>
</div>
</>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
