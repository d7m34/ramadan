<html lang="ar" dir="rtl">

<meta charset="UTF-8"/>

<title>نور | منصة إسلامية متكاملة</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0f1e;
  --card: #111827;
  --card2: #1a2235;
  --primary: #7c6af7;
  --primary2: #a78bfa;
  --gold: #f5c842;
  --gold2: #fde68a;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --border: rgba(124,106,247,0.18);
  --radius: 18px;
  --glow: 0 0 40px rgba(124,106,247,0.18);
}
.light {
  --bg: #f0f4ff;
  --card: #ffffff;
  --card2: #eef2ff;
  --text: #1e1b4b;
  --text2: #4c1d95;
  --border: rgba(124,106,247,0.15);
  --glow: 0 4px 30px rgba(124,106,247,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  transition: background .4s, color .4s;
  overflow-x: hidden;
}

/* Animated background stars */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 20% 20%, rgba(124,106,247,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 80%, rgba(245,200,66,0.05) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

#root { position: relative; z-index: 1; }

/* ===== HEADER ===== */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 20px 10px;
  position: sticky;
  top: 0;
  background: rgba(10,15,30,0.85);
  backdrop-filter: blur(14px);
  z-index: 100;
  border-bottom: 1px solid var(--border);
}
.light .app-header {
  background: rgba(240,244,255,0.88);
}
.app-header .logo {
  font-size: 22px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary2), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
}
.theme-btn {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 40px; height: 40px;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: .3s;
}
.theme-btn:hover { transform: rotate(20deg) scale(1.1); }

/* ===== MAIN ===== */
.main { padding: 16px 14px 100px; }

/* ===== CARDS ===== */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--glow);
  transition: transform .25s, box-shadow .25s;
  animation: fadeUp .45s ease both;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 40px rgba(124,106,247,0.22); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== HOME CARDS ===== */
.home-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.home-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 16px;
  text-align: center;
  cursor: pointer;
  transition: .25s;
  animation: fadeUp .4s ease both;
  box-shadow: var(--glow);
}
.home-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 40px rgba(124,106,247,0.25); }
.home-card .icon { font-size: 36px; margin-bottom: 10px; }
.home-card .label { font-weight: 700; font-size: 15px; color: var(--text); }

/* ===== HADITH BANNER ===== */
.hadith-banner {
  background: linear-gradient(135deg, #1e1256 0%, #0f172a 100%);
  border: 1px solid rgba(245,200,66,0.25);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
  animation: fadeUp .35s ease both;
}
.light .hadith-banner { background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%); }
.hadith-banner::before {
  content: '❝';
  position: absolute;
  left: 12px; top: 8px;
  font-size: 60px;
  opacity: 0.08;
  color: var(--gold);
  font-family: serif;
}
.hadith-banner .hadith-label {
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 1px;
  font-weight: 700;
  margin-bottom: 8px;
}
.hadith-banner .hadith-text {
  font-family: 'Amiri', serif;
  font-size: 17px;
  line-height: 1.9;
  color: var(--text);
}

/* ===== PRAYER TIMES ===== */
.prayer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 6px;
  background: var(--card2);
  border: 1px solid var(--border);
  font-size: 14px;
  transition: .2s;
}
.prayer-row.active-prayer {
  background: linear-gradient(135deg, rgba(124,106,247,0.2), rgba(245,200,66,0.1));
  border-color: var(--gold);
}
.prayer-row .prayer-name { font-weight: 700; }
.prayer-row .prayer-time { color: var(--gold); font-weight: 700; font-size: 15px; }

/* ===== QURAN ===== */
.surah-list .surah-item {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}
.surah-num {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--primary), var(--gold));
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  color: #fff; flex-shrink: 0;
}
.surah-name { font-weight: 700; font-size: 16px; }

.ayah-card {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
}
.ayah-num {
  display: inline-block;
  background: linear-gradient(135deg, var(--primary), var(--gold));
  color: #fff;
  border-radius: 50%;
  width: 26px; height: 26px;
  font-size: 11px; font-weight: 800;
  text-align: center; line-height: 26px;
  margin-left: 8px;
  float: left;
}
.ayah-text {
  font-family: 'Amiri', serif;
  font-size: 22px;
  line-height: 2.1;
  text-align: right;
  clear: both;
}

/* ===== AZKAR ===== */
.zikr-item {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.zikr-text { font-family: 'Amiri', serif; font-size: 17px; line-height: 1.8; flex: 1; }
.zikr-count-badge {
  background: linear-gradient(135deg, var(--primary), var(--gold));
  color: #fff;
  font-weight: 800;
  font-size: 13px;
  border-radius: 20px;
  padding: 4px 12px;
  white-space: nowrap;
  cursor: pointer;
  transition: .2s;
  user-select: none;
}
.zikr-count-badge:hover { transform: scale(1.08); }
.zikr-count-badge:active { transform: scale(0.96); }

/* ===== TASBIH ===== */
.tasbih-wrap {
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 0;
}
.tasbih-circle {
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #1e1256, #0a0f1e);
  border: 3px solid;
  border-color: var(--gold);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  box-shadow: 0 0 60px rgba(245,200,66,0.15), inset 0 0 40px rgba(124,106,247,0.1);
  cursor: pointer;
  transition: transform .12s, box-shadow .12s;
  user-select: none;
  margin: 20px auto;
}
.light .tasbih-circle { background: radial-gradient(circle at 35% 35%, #ddd6fe, #ede9fe); }
.tasbih-circle:active { transform: scale(0.94); box-shadow: 0 0 30px rgba(245,200,66,0.3); }
.tasbih-number { font-size: 58px; font-weight: 800; color: var(--gold); line-height: 1; }
.tasbih-label { font-size: 13px; color: var(--text2); margin-top: 4px; }
.tasbih-goal-bar {
  width: 200px;
  height: 8px;
  background: var(--card2);
  border-radius: 10px;
  overflow: hidden;
  margin: 10px auto;
}
.tasbih-goal-fill {
  height: 100%;
  border-radius: 10px;
  background: linear-gradient(90deg, var(--primary), var(--gold));
  transition: width .3s;
}
.tasbih-actions { display: flex; gap: 10px; margin-top: 14px; }

/* ===== BUTTONS ===== */
.btn {
  background: linear-gradient(135deg, var(--primary), var(--primary2));
  border: none;
  padding: 10px 20px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  color: #fff;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  transition: .2s;
}
.btn:hover { opacity: .88; transform: translateY(-1px); }
.btn.gold { background: linear-gradient(135deg, #b8860b, var(--gold)); }
.btn.ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
}
.btn.ghost:hover { border-color: var(--primary); color: var(--primary2); }

/* ===== SEARCH ===== */
.search-box {
  width: 100%;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  outline: none;
  transition: .3s;
  margin-bottom: 14px;
}
.search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124,106,247,0.12); }

/* ===== BOTTOM NAV ===== */
.nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex; justify-content: space-around; align-items: center;
  background: rgba(17,24,39,0.92);
  backdrop-filter: blur(18px);
  padding: 10px 8px 16px;
  border-top: 1px solid var(--border);
  z-index: 200;
}
.light .nav { background: rgba(255,255,255,0.92); }
.nav-btn {
  background: none; border: none;
  color: var(--text2);
  font-size: 11px; font-weight: 600;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  opacity: .6;
  transition: .2s;
  padding: 4px 8px;
  border-radius: 10px;
  font-family: 'Cairo', sans-serif;
}
.nav-btn .nav-icon { font-size: 20px; }
.nav-btn.active { opacity: 1; color: var(--gold); background: rgba(245,200,66,0.08); }
.nav-btn:not(.active):hover { opacity: .85; }

/* ===== SECTION TITLE ===== */
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text2);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 12px;
  padding-right: 4px;
}

/* ===== BACK BTN ===== */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: none;
  color: var(--primary2);
  font-weight: 700; font-size: 14px;
  cursor: pointer;
  margin-bottom: 14px;
  font-family: 'Cairo', sans-serif;
  padding: 6px 10px; border-radius: 8px;
  transition: .2s;
}
.back-btn:hover { background: rgba(124,106,247,0.1); }

/* ===== CHIP TABS ===== */
.chip-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--card2);
  color: var(--text2);
  font-size: 13px; font-weight: 700;
  cursor: pointer; transition: .2s;
  font-family: 'Cairo', sans-serif;
}
.chip.active-chip {
  background: linear-gradient(135deg, var(--primary), var(--primary2));
  color: #fff; border-color: transparent;
}

/* ===== PAGE TITLE ===== */
.page-title {
  font-size: 20px; font-weight: 800;
  margin-bottom: 18px;
  background: linear-gradient(135deg, var(--primary2), var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;

/* ===== COUNTER SECTION ===== */
.counter-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
.counter-chip {
  padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
  border: 1px solid var(--border); background: var(--card2);
  cursor: pointer; color: var(--text2);
  font-family: 'Cairo', sans-serif; transition: .2s;
}
.counter-chip.active-chip { background: linear-gradient(135deg,var(--primary),var(--gold)); color:#fff; border-color:transparent; }
</style>
</head>

const PRAYERS = [
  {name:"الفجر",  icon:"🌙", time:"05:14"},
  {name:"الشروق", icon:"🌅", time:"06:38"},
  {name:"الظهر",  icon:"☀️", time:"12:27"},
  {name:"العصر",  icon:"🌤", time:"15:45"},
  {name:"المغرب", icon:"🌇", time:"18:22"},
  {name:"العشاء", icon:"🌃", time:"19:52"},
];

const TASBIH_PRESETS = [
  {label:"سبحان الله", max:33},
  {label:"الحمد لله",  max:33},
  {label:"الله أكبر", max:34},
  {label:"لا إله إلا الله", max:100},
  {label:"اللهم صل", max:100},
];

/* ==================== COMPONENTS ==================== */

function Header({theme, setTheme}) {
  return (
    <div className="app-header">
      <div className="logo">✦ نور</div>
      <button className="theme-btn" onClick={()=>setTheme(t=>t==="dark"?"light":"dark")}>
        {theme==="dark"?"🌕":"🌑"}
      </button>
    </div>
  );
}

function Home({setScreen}) {
  const [hadithIdx] = useState(Math.floor(Math.random()*HADITH_DATA.length));
  const now = new Date();
  const hour = now.getHours();
  const greeting = hour < 12 ? "صباح الخير" : hour < 17 ? "مرحباً" : "مساء الخير";

  return (
    <div className="main">
      {/* Greeting */}
      <div style={{marginBottom:18, animation:"fadeUp .3s ease both"}}>
        <div style={{fontSize:14, color:"var(--text2)", marginBottom:4}}>{greeting} 👋</div>
        <div style={{fontSize:22, fontWeight:800}}>مرحباً بك في نور</div>
      </div>

      {/* Hadith of day */}
      <div className="hadith-banner">
        <div className="hadith-label">📖 حديث اليوم</div>
        <div className="hadith-text">{HADITH_DATA[hadithIdx].text}</div>
        <div style={{fontSize:12, color:"var(--gold)", marginTop:8, fontWeight:700}}>— {HADITH_DATA[hadithIdx].source}</div>
      </div>

      {/* Prayer times */}
      <div className="card" style={{padding:16}}>
        <div className="section-title">🕌 مواقيت الصلاة</div>
        {PRAYERS.map((p,i)=>(
          <div key={i} className={`prayer-row ${p.name==="الظهر"?"active-prayer":""}`}>
            <span>{p.icon} <span className="prayer-name">{p.name}</span></span>
            <span className="prayer-time">{p.time}</span>
          </div>
        ))}
      </div>

      {/* Main features */}
      <div className="section-title" style={{marginTop:4}}>الأقسام الرئيسية</div>
      <div className="home-grid">
        {[
          {icon:"📖", label:"القرآن الكريم", screen:"quran"},
          {icon:"🌿", label:"الأذكار",       screen:"azkar"},
          {icon:"📿", label:"المسبحة",       screen:"tasbih"},
          {icon:"📚", label:"الأحاديث",      screen:"hadith"},
        ].map((item, i) => (
          <div key={i} className="home-card" style={{animationDelay:`${i*0.08}s`}} onClick={()=>setScreen(item.screen)}>
            <div className="icon">{item.icon}</div>
            <div className="label">{item.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Quran() {
  const [search, setSearch] = useState("");
  const [selected, setSelected] = useState(null);

  if (selected) {
    const ayahs = QURAN_SAMPLE[selected.id] || [{n:1, t:"سيتم إضافة آيات هذه السورة قريباً"}];
    return (
      <div className="main">
        <button className="back-btn" onClick={()=>setSelected(null)}>← رجوع</button>
        <div className="page-title">سورة {selected.name}</div>
        <div style={{fontSize:12, color:"var(--text2)", marginBottom:14}}>{selected.type} — {selected.ayat} آية</div>

        {ayahs.map((a, i) => (
          <div key={i} className="ayah-card" style={{animationDelay:`${i*0.06}s`, animation:"fadeUp .4s ease both"}}>
            <div className="ayah-num">{a.n}</div>
            <div className="ayah-text">{a.t}</div>
          </div>
        ))}
      </div>
    );
  }

  const filtered = SURAHS.filter(s => s.name.includes(search));
  return (
    <div className="main">
      <div className="page-title">القرآن الكريم</div>
      <input
        className="search-box"
        placeholder="🔍  ابحث عن سورة..."
        value={search}
        onChange={e=>setSearch(e.target.value)}
      />
      <div className="surah-list">
        {filtered.map((s,i)=>(
          <div key={s.id} className="card surah-item" style={{animationDelay:`${i*0.04}s`, cursor:"pointer"}} onClick={()=>setSelected(s)}>
            <div className="surah-num">{s.id}</div>
            <div style={{flex:1}}>
              <div className="surah-name">{s.name}</div>
              <div style={{fontSize:12, color:"var(--text2)"}}>{s.type} • {s.ayat} آية</div>
            </div>
            <div style={{color:"var(--text2)", fontSize:18}}>←</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Azkar() {
  const [tab, setTab] = useState("الصباح");
  const [counts, setCounts] = useState({});

  const tabKeys = Object.keys(AZKAR_DATA);
  const items = AZKAR_DATA[tab];

  const inc = (idx) => {
    const key = `${tab}_${idx}`;
    setCounts(c => {
      const cur = c[key] || 0;
      const max = items[idx].repeat;
      return {...c, [key]: cur < max ? cur+1 : cur};
    });
  };

  return (
    <div className="main">
      <div className="page-title">الأذكار</div>
      <div className="chip-tabs">
        {tabKeys.map(k => (
          <button key={k} className={`chip ${tab===k?"active-chip":""}`} onClick={()=>setTab(k)}>
            {k==="الصباح"?"🌅":k==="المساء"?"🌇":"🌙"} {k}
          </button>
        ))}
      </div>

      {items.map((z,i)=>{
        const key = `${tab}_${i}`;
        const cur = counts[key]||0;
        const done = cur >= z.repeat;
        return (
          <div key={i} className="zikr-item" style={{animation:"fadeUp .4s ease both", animationDelay:`${i*0.07}s`, opacity: done ? .5 : 1}}>
            <div style={{flex:1}}>
              <div className="zikr-text" style={{textDecoration: done?"line-through":"none"}}>{z.text}</div>
              {z.repeat > 1 && <div style={{fontSize:12, color:"var(--text2)", marginTop:4}}>يُكرر {z.repeat} مرة</div>}
            </div>
            <div className="zikr-count-badge" onClick={()=>inc(i)}>
              {done ? "✓" : `${cur}/${z.repeat}`}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Tasbih() {
  const [preset, setPreset] = useState(0);
  const [count, setCount] = useState(0);
  const goal = TASBIH_PRESETS[preset].max;
  const pct = Math.min((count/goal)*100, 100);
  const done = count >= goal;

  const tap = () => {
    if (!done) setCount(c => c+1);
    else setCount(0);
  };

  return (
    <div className="main">
      <div className="page-title">المسبحة الإلكترونية</div>

      <div className="counter-chips">
        {TASBIH_PRESETS.map((p,i)=>(
          <button key={i} className={`counter-chip ${preset===i?"active-chip":""}`}
            onClick={()=>{setPreset(i); setCount(0);}}>
            {p.label}
          </button>
        ))}
      </div>

      <div className="tasbih-wrap">
        <div style={{fontSize:16, fontWeight:700, marginBottom:4, color:"var(--text2)"}}>
          {TASBIH_PRESETS[preset].label}
        </div>

        <div className="tasbih-circle" onClick={tap}
          style={{borderColor: done ? "#22c55e" : "var(--gold)"}}>
          <div className="tasbih-number" style={{color: done ? "#22c55e" : "var(--gold)"}}>
            {done ? "✓" : count}
          </div>
          <div className="tasbih-label">{done ? "أحسنت!" : `من ${goal}`}</div>
        </div>

        <div className="tasbih-goal-bar">
          <div className="tasbih-goal-fill" style={{width:`${pct}%`, background: done ? "#22c55e" : undefined}}/>
        </div>

        <div style={{fontSize:13, color:"var(--text2)", marginBottom:10}}>
          {done ? "اضغط للبدء من جديد" : "اضغط على الدائرة للتسبيح"}
        </div>

        <div className="tasbih-actions">
          <button className="btn ghost" onClick={()=>setCount(0)}>إعادة</button>
        </div>
      </div>
    </div>
  );
}

function Hadith() {
  return (
    <div className="main">
      <div className="page-title">الأحاديث النبوية</div>
      {HADITH_DATA.map((h,i)=>(
        <div key={i} className="card" style={{animationDelay:`${i*0.06}s`}}>
          <div style={{fontSize:12, color:"var(--gold)", fontWeight:700, marginBottom:8}}>حديث {i+1}</div>
          <div style={{fontFamily:"'Amiri',serif", fontSize:19, lineHeight:2, marginBottom:8}}>{h.text}</div>
          <div style={{fontSize:12, color:"var(--text2)", borderTop:"1px solid var(--border)", paddingTop:8}}>📚 {h.source}</div>
        </div>
      ))}
    </div>
  );
}

/* ==================== APP ==================== */

function App() {
  const [screen, setScreen] = useState("home");
  const [theme, setTheme] = useState(
    ()=>localStorage.getItem("noor_theme")||"dark"
  );

  useEffect(()=>{
    document.body.className = theme==="light" ? "light" : "";
    localStorage.setItem("noor_theme", theme);
  }, [theme]);

  const tabs = [
    {id:"home",   icon:"🏠", label:"الرئيسية"},
    {id:"quran",  icon:"📖", label:"القرآن"},
    {id:"azkar",  icon:"🌿", label:"الأذكار"},
    {id:"tasbih", icon:"📿", label:"المسبحة"},
    {id:"hadith", icon:"📚", label:"أحاديث"},
  ];

  return (
    <>
      <Header theme={theme} setTheme={setTheme}/>
      {screen==="home"   && <Home   setScreen={setScreen}/>}
      {screen==="quran"  && <Quran/>}
      {screen==="azkar"  && <Azkar/>}
      {screen==="tasbih" && <Tasbih/>}
      {screen==="hadith" && <Hadith/>}

      <div className="nav">
        {tabs.map(t=>(
          <button key={t.id} className={`nav-btn ${screen===t.id?"active":""}`} onClick={()=>setScreen(t.id)}>
            <span className="nav-icon">{t.icon}</span>
            <span>{t.label}</span>
          </button>
        ))}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
