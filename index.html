<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>نور | منصة إسلامية متكاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f;--bg2:#0d1117;--card:#111827;--card2:#162033;
  --b1:rgba(99,102,241,.15);--b2:rgba(255,255,255,.06);
  --t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;
  --p1:#6366f1;--p2:#818cf8;--g1:#f59e0b;--g2:#fbbf24;
  --r:16px;
}
.th-green{--p1:#059669;--p2:#34d399;--g1:#84cc16;--g2:#a3e635;}
.th-gold {--p1:#b45309;--p2:#d97706;--g1:#92400e;--g2:#fcd34d;}
.th-blue {--p1:#0284c7;--p2:#38bdf8;--g1:#0369a1;--g2:#7dd3fc;}
.th-rose {--p1:#be185d;--p2:#f472b6;--g1:#9d174d;--g2:#fbcfe8;}
.light  {--bg:#f8faff;--bg2:#eef2ff;--card:#fff;--card2:#f0f4ff;--b2:rgba(0,0,0,.06);--t1:#1e1b4b;--t2:#4c1d95;--t3:#6d28d9;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--t1);font-family:'Tajawal',sans-serif;min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden;}
/* باقي الستايل كما هو بدون أي تغيير */
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:54px;height:54px;border-radius:14px;background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;}
.logo-txt{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--p2),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
</style>
</head>
<body>
<div id="loader"> ... نفس اللودر بدون تغيير ... </div>
<div class="orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script>
/* نفس السكربت كامل بدون أي تغيير */

/* === تعديل اللوقو فقط داخل الهيدر === */
function Header(p){
  var titles={home:"نور",quran:"القرآن الكريم",azkar:"الأذكار",tasbih:"المسبحة",hadith:"أحاديث",favorites:"المفضلة",stats:"إحصائياتي",settings:"الإعدادات",wird:"الورد اليومي"};
  return React.createElement("div",{className:"hdr"},
    React.createElement("div",{className:"logo"},
      React.createElement("div",{className:"logo-icon"},
        React.createElement("svg",{viewBox:"0 0 130 130",width:"54",height:"54",xmlns:"http://www.w3.org/2000/svg"},
          React.createElement("path",{d:"M65 10c-30 0-55 25-55 55s25 55 55 55 55-25 55-55S95 10 65 10z",fill:"none",stroke:"#fbbf24",strokeWidth:"6"}),
          React.createElement("path",{d:"M65 28c-20 0-37 17-37 37s17 37 37 37",fill:"none",stroke:"#fbbf24",strokeWidth:"6",strokeLinecap:"round"}),
          React.createElement("text",{x:"65",y:"78",textAnchor:"middle",fontSize:"44",fill:"#fbbf24",fontFamily:"Amiri"},"روح")
        )
      ),
      React.createElement("span",{className:"logo-txt"},titles[p.screen]||"نور")
    ),
    React.createElement("div",{className:"hdr-btns"},
      p.screen!=="favorites"&&React.createElement("button",{className:"ibtn",onClick:function(){p.go("favorites");}},"🔖"),
      p.screen!=="stats"&&React.createElement("button",{className:"ibtn",onClick:function(){p.go("stats");}},"📊"),
      p.screen!=="settings"&&React.createElement("button",{className:"ibtn",onClick:function(){p.go("settings");}},"⚙️"),
      React.createElement("button",{className:"ibtn",onClick:p.toggleTheme},p.theme==="dark"?"🌕":"🌑")
    )
  );
}
</script>
</body>
</html>
