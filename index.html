<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#4c1d95"/>
<meta name="description" content="روح - منصة إسلامية متكاملة للقرآن والأذكار والمواقيت"/>
<title>روح | منصة إسلامية متكاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:wght@400;700&family=Scheherazade:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0612;--bg2:#130c1f;--card:#1a1025;--card2:#241636;
  --b1:rgba(139,92,246,.2);--b2:rgba(255,255,255,.05);
  --t1:#faf5ff;--t2:#d8b4fe;--t3:#a855f7;--t4:#7c3aed;
  --p1:#8b5cf6;--p2:#a78bfa;--g1:#fbbf24;--g2:#f59e0b;
  --accent:#ec4899;--success:#22c55e;--warning:#f59e0b;
  --r:24px;--r-sm:16px;
}
.th-emerald{--p1:#10b981;--p2:#34d399;--g1:#84cc16;--g2:#65a30d;--accent:#06b6d4;}
.th-rose{--p1:#f43f5e;--p2:#fb7185;--g1:#fbbf24;--g2:#f59e0b;--accent:#8b5cf6;}
.th-ocean{--p1:#0ea5e9;--p2:#38bdf8;--g1:#22d3ee;--g2:#06b6d4;--accent:#f472b6;}
.th-gold{--p1:#d97706;--p2:#fbbf24;--g1:#f59e0b;--g2:#d97706;--accent:#dc2626;}
.light{--bg:#faf8fc;--bg2:#f3e8ff;--card:#ffffff;--card2:#fae8ff;--b2:rgba(0,0,0,.06);--t1:#2e1065;--t2:#6b21a8;--t3:#9333ea;--t4:#7c3aed;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--t1);font-family:'Tajawal',sans-serif;min-height:100vh;transition:all .4s ease;overflow-x:hidden;line-height:1.6;}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.15;animation:float 20s ease-in-out infinite;}
.orb1{width:500px;height:500px;background:var(--p1);top:-150px;right:-150px;}
.orb2{width:400px;height:400px;background:var(--accent);bottom:-100px;left:-100px;animation-delay:-5s;}
.orb3{width:300px;height:300px;background:var(--g1);top:40%;left:20%;opacity:.1;animation-delay:-10s;}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-30px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.9)}}
.light .orb{opacity:.08;}
#app{position:relative;z-index:1;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--bg2);border-radius:3px;}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--p1),var(--accent));border-radius:3px;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(10,6,18,.9);backdrop-filter:blur(20px);position:sticky;top:0;z-index:500;border-bottom:1px solid var(--b1);}
.light .hdr{background:rgba(250,248,252,.95);}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--p1),var(--accent));display:flex;align-items:center;justify-content:center;box-shadow:0 8px32px rgba(139,92,246,.4);position:relative;overflow:hidden;}
.logo-icon::before{content:'';position:absolute;inset:0;background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 10 C30 10,15 30,15 50 C15 75,35 90,50 90 C65 90,85 75,85 50 C85 30,70 10,50 10 M50 20 C60 20,70 30,70 50 C70 65,60 75,50 75 C40 75,30 65,30 50 C30 30,40 20,50 20" fill="none" stroke="white" stroke-width="3" opacity="0.3"/></svg>');background-size:60%;background-position:center;background-repeat:no-repeat;}
.logo-txt{font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--t1),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;}
.hdr-btns{display:flex;gap:10px;}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--b1);background:var(--card2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .3s cubic-bezier(.4,0,.2,1);color:var(--t2);}
.ibtn:hover{transform:translateY(-2px) scale(1.05);border-color:var(--p1);box-shadow:0 8px24px rgba(139,92,246,.3);color:var(--p1);}
.main{padding:20px 20px 100px;max-width:680px;margin:0 auto;}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-200%0}100%{background-position:200%0}}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid var(--b2);border-radius:var(--r);padding:24px;margin-bottom:16px;box-shadow:0 4px30px rgba(0,0,0,.4),0 0 0 1px rgba(139,92,246,.1);animation:fadeUp .5s ease both;transition:all .3s ease;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--p1),transparent);opacity:.5;}
.card:hover{transform:translateY(-4px);box-shadow:0 12px40px rgba(139,92,246,.2),0 0 0 1px rgba(139,92,246,.2);}
.card-inner{background:var(--card2);border-radius:var(--r-sm);padding:20px;border:1px solid var(--b2);margin-bottom:16px;}
.grad{background:linear-gradient(135deg,var(--p2),var(--g1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ptitle{font-size:28px;font-weight:900;margin-bottom:6px;letter-spacing:-0.5px;}
.psub{font-size:14px;color:var(--t3);margin-bottom:20px;font-weight:500;}
.slbl{font-size:12px;font-weight:800;color:var(--t3);letter-spacing:2px;margin-bottom:14px;display:flex;align-items:center;gap:10px;text-transform:uppercase;}
.slbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--b1),transparent);}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:14px;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700;font-size:15px;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:translateX(-100%);transition:.5s;}
.btn:hover::before{transform:translateX(100%);}
.btn-p{background:linear-gradient(135deg,var(--p1),var(--accent));color:#fff;box-shadow:0 8px24px rgba(139,92,246,.4);}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 12px32px rgba(139,92,246,.5);}
.btn-g{background:var(--card2);border:1px solid var(--b1);color:var(--t2);}
.btn-g:hover{border-color:var(--p1);color:var(--p1);background:var(--bg2);}
.btn-sm{padding:10px 18px;font-size:13px;border-radius:12px;}
.btn-back{background:none;border:none;color:var(--p2);font-weight:700;font-size:15px;cursor:pointer;padding:10px 16px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;font-family:'Tajawal',sans-serif;margin-bottom:18px;transition:.3s;}
.btn-back:hover{background:rgba(139,92,246,.15);transform:translateX(-4px);}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.tab{padding:10px 20px;border-radius:25px;font-size:14px;font-weight:700;border:1px solid var(--b1);background:var(--card2);color:var(--t3);cursor:pointer;transition:all .3s ease;font-family:'Tajawal',sans-serif;white-space:nowrap;}
.tab.on{background:linear-gradient(135deg,var(--p1),var(--accent));color:#fff;border-color:transparent;box-shadow:0 4px16px rgba(139,92,246,.4);}
.search{width:100%;padding:16px 20px;background:var(--card);border:1px solid var(--b2);border-radius:16px;color:var(--t1);font-family:'Tajawal',sans-serif;font-size:15px;outline:none;transition:.3s;margin-bottom:18px;}
.search::placeholder{color:var(--t3);}
.search:focus{border-color:var(--p1);box-shadow:0 0 0 4px rgba(139,92,246,.15);}
.prog{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;position:relative;}
.prog-f{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--p1),var(--accent),var(--g1));background-size:200%100%;animation:shimmer 2s infinite;transition:width .5s ease;position:relative;}
.prog-f::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 2s infinite;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;background:linear-gradient(135deg,var(--p1),var(--accent));color:#fff;box-shadow:0 4px12px rgba(139,92,246,.3);}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:rgba(10,6,18,.95);backdrop-filter:blur(24px);padding:12px 8px 24px;border-top:1px solid var(--b1);z-index:500;}
.light .nav{background:rgba(250,248,252,.98);}
.nbtn{background:none;border:none;color:var(--t3);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px 16px;border-radius:16px;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:700;transition:all .3s ease;position:relative;}
.nbtn .ni{font-size:24px;line-height:1;transition:.3s;}
.nbtn.on{color:var(--g1);}
.nbtn.on .ni{transform:translateY(-4px);filter:drop-shadow(0 4px8px rgba(251,191,36,.5));}
.nbtn::after{content:'';position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--g1);opacity:0;transition:.3s;}
.nbtn.on::after{opacity:1;}
.spinner{width:48px;height:48px;border:4px solid var(--b1);border-top-color:var(--p2);border-radius:50%;animation:spin .8s linear infinite;margin:50px auto;display:block;position:relative;}
.spinner::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:4px solid transparent;border-top-color:var(--accent);animation:spin 1.2s linear infinite reverse;}
.greeting{padding:24px 0 18px;animation:fadeUp .4s ease both;}
.hijri{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--card2),var(--bg2));border:1px solid var(--b1);border-radius:25px;padding:8px 18px;font-size:14px;font-weight:700;color:var(--g1);margin-top:12px;box-shadow:0 4px16px rgba(0,0,0,.2);}
.hdth-banner{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card2),var(--bg2));border:1px solid var(--b1);border-radius:var(--r);padding:24px;margin-bottom:16px;animation:fadeUp .4s ease both;}
.hdth-banner::before{content:'"';position:absolute;left:20px;top:10px;font-size:100px;opacity:.05;color:var(--g1);font-family:serif;line-height:1;}
.hdth-tag{font-size:12px;font-weight:800;color:var(--g1);letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.hdth-txt{font-family:'Amiri',serif;font-size:20px;line-height:2.2;color:var(--t1);}
.hdth-src{font-size:13px;color:var(--g2);font-weight:700;margin-top:12px;padding-top:12px;border-top:1px solid var(--b2);display:flex;align-items:center;gap:8px;}
.pray-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.pcell{background:var(--card2);border:1px solid var(--b2);border-radius:16px;padding:16px 12px;text-align:center;transition:all .3s ease;position:relative;}
.pcell.next{background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(236,72,153,.1));border-color:var(--g1);transform:scale(1.05);box-shadow:0 8px24px rgba(251,191,36,.2);}
.pcell.next::before{content:'التالية';position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--g1);color:var(--bg);font-size:10px;font-weight:800;padding:2px 10px;border-radius:10px;}
.pcell .pn{font-size:13px;font-weight:700;color:var(--t2);margin:6px 0 4px;}
.pcell .pt{font-size:18px;font-weight:900;color:var(--g1);font-family:'Tajawal',sans-serif;}
.pcell .ptime-remaining{font-size:11px;color:var(--accent);margin-top:4px;font-weight:700;}
.feat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.fcrd{background:var(--card);border:1px solid var(--b2);border-radius:var(--r);padding:28px 18px;text-align:center;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);animation:fadeUp .5s ease both;position:relative;overflow:hidden;}
.fcrd::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(139,92,246,.1),transparent);opacity:0;transition:.3s;}
.fcrd:hover::after{opacity:1;}
.fcrd:hover{transform:translateY(-6px) scale(1.02);border-color:var(--p1);box-shadow:0 20px50px rgba(139,92,246,.3);}
.fcrd .fi{font-size:42px;margin-bottom:12px;display:block;transition:.3s;}
.fcrd:hover .fi{transform:scale(1.1);}
.fcrd .fl{font-size:16px;font-weight:800;margin-bottom:4px;}
.fcrd .fd{font-size:12px;color:var(--t3);line-height:1.5;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.sbox{background:var(--card2);border:1px solid var(--b2);border-radius:16px;padding:20px 12px;text-align:center;transition:.3s;}
.sbox:hover{transform:translateY(-2px);border-color:var(--b1);}
.snum{font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--p2),var(--g1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.slb{font-size:12px;color:var(--t3);font-weight:700;margin-top:4px;}
.si{display:flex;align-items:center;gap:16px;cursor:pointer;padding:18px;background:var(--card);border:1px solid var(--b2);border-radius:18px;margin-bottom:10px;transition:all .3s ease;animation:fadeUp .5s ease both;position:relative;}
.si:hover{border-color:var(--p1);transform:translateX(-6px);box-shadow:0 8px24px rgba(139,92,246,.15);}
.si:active{transform:scale(.98);}
.snum2{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--accent));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;flex-shrink:0;box-shadow:0 8px20px rgba(139,92,246,.4);}
.si-name{font-size:17px;font-weight:800;}
.si-meta{font-size:13px;color:var(--t3);margin-top:3px;}
.ayah-wrap{background:var(--card2);border:1px solid var(--b2);border-radius:18px;padding:22px;margin-bottom:14px;animation:fadeUp .5s ease both;transition:.3s;}
.ayah-wrap:hover{border-color:var(--b1);transform:translateX(4px);}
.ayah-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.anum{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--accent));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;box-shadow:0 4px12px rgba(139,92,246,.4);}
.aact{display:flex;gap:10px;}
.aabtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--b2);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .3s;color:var(--t2);}
.aabtn:hover{border-color:var(--p1);background:var(--p1);color:#fff;transform:scale(1.1);}
.aabtn.fav{background:var(--g1);border-color:var(--g1);color:var(--bg);}
.ayah-ar{font-family:'Scheherazade','Amiri',serif;text-align:right;line-height:2.6;letter-spacing:0.5px;}
.ayah-tr{font-size:14px;color:var(--t2);margin-top:16px;padding-top:16px;border-top:1px solid var(--b2);line-height:1.9;}
.fc-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.fsbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--b1);background:var(--card2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;transition:.3s;color:var(--t1);}
.fsbtn:hover{border-color:var(--p1);background:var(--p1);color:#fff;transform:scale(1.1);}
.zcrd{background:var(--card);border:1px solid var(--b2);border-radius:18px;padding:22px;margin-bottom:14px;animation:fadeUp .5s ease both;transition:all .3s;}
.zcrd.done{opacity:.6;background:var(--bg2);}
.zcrd.done .ztxt{opacity:.7;}
.ztxt{font-family:'Amiri',serif;font-size:20px;line-height:2.2;margin-bottom:16px;color:var(--t1);}
.zfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.ztap{background:linear-gradient(135deg,var(--p1),var(--accent));color:#fff;border:none;border-radius:14px;padding:12px 24px;font-family:'Tajawal',sans-serif;font-weight:800;font-size:14px;cursor:pointer;transition:all .2s;white-space:nowrap;box-shadow:0 4px16px rgba(139,92,246,.4);}
.ztap:hover{transform:scale(1.05);box-shadow:0 8px24px rgba(139,92,246,.5);}
.ztap:active{transform:scale(.95);}
.tpage{text-align:center;padding-top:12px;}
.pscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:24px;scrollbar-width:none;}
.pscroll::-webkit-scrollbar{display:none;}
.pchip{white-space:nowrap;padding:12px 22px;border-radius:25px;border:1px solid var(--b1);background:var(--card2);color:var(--t3);font-size:14px;font-weight:700;cursor:pointer;transition:all .3s;font-family:'Tajawal',sans-serif;}
.pchip.on{background:linear-gradient(135deg,var(--p1),var(--accent));color:#fff;border-color:transparent;box-shadow:0 4px16px rgba(139,92,246,.4);transform:scale(1.05);}
.tcircle{width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--card2),var(--bg2));border:4px solid var(--g1);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 80px rgba(139,92,246,.2),inset 0 0 60px rgba(0,0,0,.3),0 0 0 20px rgba(251,191,36,.05);cursor:pointer;margin:0 auto 24px;transition:all .2s;user-select:none;position:relative;overflow:hidden;}
.tcircle::before{content:'';position:absolute;inset:0;background:conic-gradient(from 0deg,transparent,var(--g1),transparent);opacity:.3;animation:spin 10s linear infinite;}
.tcircle:active{transform:scale(.95);}
.tnum{font-size:72px;font-weight:900;color:var(--g1);line-height:1;position:relative;z-index:1;text-shadow:0 0 40px rgba(251,191,36,.5);}
.tsub{font-size:15px;color:var(--t3);margin-top:8px;position:relative;z-index:1;font-weight:600;}
.hcrd{background:var(--card);border:1px solid var(--b2);border-radius:var(--r);padding:26px;margin-bottom:16px;position:relative;overflow:hidden;animation:fadeUp .5s ease both;transition:.3s;}
.hcrd::before{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:linear-gradient(to bottom,var(--p1),var(--accent),var(--g1));}
.hcrd:hover{transform:translateX(6px);border-color:var(--b1);}
.hidx{font-size:12px;font-weight:800;color:var(--p2);letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.htxt{font-family:'Amiri',serif;font-size:21px;line-height:2.2;margin-bottom:14px;}
.hfoot{display:flex;align-items:center;justify-content:space-between;}
.hsrc{font-size:13px;color:var(--g2);font-weight:700;background:rgba(251,191,36,.1);padding:6px 14px;border-radius:20px;border:1px solid rgba(251,191,36,.2);}
.wcrd{background:var(--card);border:1px solid var(--b2);border-radius:18px;padding:22px;margin-bottom:14px;animation:fadeUp .5s ease both;transition:.3s;}
.whdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.wtitle{font-size:17px;font-weight:800;}
.wdone{font-size:12px;font-weight:800;padding:6px 14px;border-radius:20px;background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3);}
.favcrd{background:var(--card);border:1px solid rgba(251,191,36,.2);border-radius:18px;padding:22px;margin-bottom:14px;animation:fadeUp .5s ease both;position:relative;overflow:hidden;}
.favcrd::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g1),var(--accent));}
.favtype{font-size:12px;font-weight:800;color:var(--g1);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.srow{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background:var(--card);border:1px solid var(--b2);border-radius:16px;margin-bottom:10px;transition:.3s;}
.srow:hover{border-color:var(--b1);}
.srow-l{display:flex;align-items:center;gap:14px;}
.sr-icon{font-size:24px;width:48px;height:48px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;}
.sr-title{font-size:15px;font-weight:800;}
.sr-sub{font-size:13px;color:var(--t3);margin-top:2px;}

function toHijri(d){
  var jd=Math.floor((14+365.25*(d.getFullYear()+4716))/365.25)+Math.floor((1+d.getMonth())/3/12*365)+d.getDate()-1524;
  var l=jd-1948440+10632,n=Math.floor((l-1)/10631);
  l=l-10631*n+354;
  var j=Math.floor((10985-l)/5316)*Math.floor(50*l/17719)+Math.floor(l/5670)*Math.floor(43*l/15238);
  l=l-Math.floor((30-j)/15)*Math.floor(17719*j/50)-Math.floor(j/16)*Math.floor(15238*j/43)+29;
  var mo=Math.floor((24+l*20)/610),day=l-Math.floor(610*mo/20)+1,yr=30*n+j-30+Math.floor((3+mo)/12);
  var ms=["محرم","صفر","ربيع الأول","ربيع الثاني","جمادى الأولى","جمادى الثانية","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
  return {day:day,month:ms[mo-1],year:yr,full:day+" "+ms[mo-1]+" "+yr+" هـ"};
}

function calcPrayers(lat,lng){
  var d=new Date(),tz=-d.getTimezoneOffset()/60;
  var JD=367*d.getFullYear()-Math.floor(7*(d.getFullYear()+Math.floor((d.getMonth()+10)/12))/4)+Math.floor(275*(d.getMonth()+1)/9)+d.getDate()-730531.5;
  var L=(280.46+0.9856474*JD)%360,M=((357.528+0.9856003*JD)%360)*Math.PI/180;
  var lam=(L+1.915*Math.sin(M)+0.02*Math.sin(2*M))*Math.PI/180;
  var eps=(23.439-0.0000004*JD)*Math.PI/180;
  var decl=Math.asin(Math.sin(eps)*Math.sin(lam));
  var eqt=L/15-Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam))*12/Math.PI;
  var latR=lat*Math.PI/180;
  var noon=12-eqt+(lng-tz*15)/15*(-1);
  var ha=function(a){return Math.acos((Math.sin(a*Math.PI/180)-Math.sin(latR)*Math.sin(decl))/(Math.cos(latR)*Math.cos(decl)))*180/Math.PI/15;};
  var fmt=function(v){var hh=Math.floor(v),mm=Math.round((v-hh)*60);return(hh<10?"0"+hh:hh)+":"+(mm<10?"0"+mm:mm);};
  var sr=ha(-0.8333);
  var asrH=Math.acos((Math.sin(Math.atan(1+Math.tan(Math.abs(latR-decl))))-Math.sin(latR)*Math.sin(decl))/(Math.cos(latR)*Math.cos(decl)))*180/Math.PI/15;
  return [fmt(noon-ha(-18)),fmt(noon-sr),fmt(noon),fmt(noon+asrH),fmt(noon+sr),fmt(noon+sr+(noon-(noon-ha(-18)))*0.35)];
}

function getTimeRemaining(targetTime){
  var now=new Date();
  var target=new Date();
  var parts=targetTime.split(":");
  target.setHours(parseInt(parts[0]),parseInt(parts[1]),0);
  if(target<now)target.setDate(target.getDate()+1);
  var diff=target-now;
  var hours=Math.floor(diff/(1000*60*60));
  var minutes=Math.floor((diff%(1000*60*60))/(1000*60));
  return {hours:hours,minutes:minutes,total:diff};
}

        h("div",{className:"srow-l"},h("div",{className:"sr-icon"},p.theme==="dark"?"🌙":"☀️"),h("div",null,h("div",{className:"sr-title"},"الوضع الليلي"),h("div",{className:"sr-sub"},p.theme==="dark"?"مفعل":"معطل"))),
        h("div",{className:"toggle"+(p.theme==="dark"?" on":""),onClick:p.toggleTheme})
      )
    ),
    
    h("div",{style:{marginBottom:20}},
      h("div",{style:{fontSize:12,fontWeight:800,color:"var(--t3)",letterSpacing:"2px",marginBottom:12,textTransform:"uppercase"}},"لون التطبيق"),
      h("div",{className:"card",style:{padding:20}},
        h("div",{className:"swatches"},
          colors.map(function(c,i){return h("button",{key:i,className:"swatch"+(p.color===c.cls?" on":""),title:c.l,style:{background:c.bg},onClick:function(){p.setColor(c.cls);}});})
        ),
        h("div",{style:{fontSize:13,color:"var(--t3)",marginTop:12,fontWeight:500}},"اختر اللون المفضل لديك")
      )
    ),
    
    h("div",{className:"card",style:{padding:24}},
      h("div",{style:{display:"flex",alignItems:"center",gap:16,marginBottom:14}},
        h("div",{className:"logo-icon",style:{width:64,height:64,borderRadius:20}}),
        h("div",null,h("div",{className:"logo-txt",style:{fontSize:24}},"روح"),h("div",{style:{fontSize:13,color:"var(--t3)",fontWeight:500}},"الإصدار 3.0"))
      ),
      h("div",{style:{fontSize:14,color:"var(--t2)",lineHeight:1.9}},"منصة إسلامية متكاملة تجمع بين القرآن الكريم والأذكار والمواقيت والأحاديث النبوية في تجربة روحانية مميزة.")
    )
  );
}

function App(){
  var s1=useState("home"),screen=s1[0],setScreen=s1[1];
  var s2=useState(function(){return ld("rouh_t","dark");}),theme=s2[0],setTheme=s2[1];
  var s3=useState(function(){return ld("rouh_c","");}),color=s3[0],setColor=s3[1];
  var s4=useState(function(){return ld("rouh_s",{reads:0,tasbih:0,azkar:0,favAyahs:0});}),stats=s4[0],setStats=s4[1];
  var s5=useState(function(){return ld("rouh_f",{ayahs:{},hadiths:{}});}),favs=s5[0],setFavs=s5[1];
  var s6=useState(["--:--","--:--","--:--","--:--","--:--","--:--"]),pTimes=s6[0],setPTimes=s6[1];
  var s7=useState(true),pLoad=s7[0],setPLoad=s7[1];
  var s8=useState(false),pErr=s8[0],setPErr=s8[1];
  var s9=useState(""),city=s9[0],setCity=s9[1];
  
  useEffect(function(){
    var cls=[theme==="dark"?"":"light",color].filter(Boolean).join(" ");
    document.body.className=cls;
    sv("rouh_t",theme);sv("rouh_c",color);
  },[theme,color]);
  
  useEffect(function(){sv("rouh_s",stats);},[stats]);
  useEffect(function(){sv("rouh_f",favs);},[favs]);
  useEffect(function(){hideLoader();},[]);
  
  function reqGeo(){
    setPLoad(true);setPErr(false);
    if(!navigator.geolocation){setPErr(true);setPLoad(false);return;}
    navigator.geolocation.getCurrentPosition(
      function(pos){
        var lat=pos.coords.latitude,lng=pos.coords.longitude;
        setPTimes(calcPrayers(lat,lng));
        fetch("https://nominatim.openstreetmap.org/reverse?lat="+lat+"&lon="+lng+"&format=json")
          .then(function(r){return r.json();})
          .then(function(d){setCity(d.address.city||d.address.town||d.address.state||d.address.country||"");})
          .catch(function(){});
        setPLoad(false);
      },
      function(){setPErr(true);setPLoad(false);}
    );
  }
  
  useEffect(function(){reqGeo();},[]);
  
  function toggleTheme(){setTheme(function(t){return t==="dark"?"light":"dark";});}
  function incReads(){setStats(function(s){var o=Object.assign({},s);o.reads=(s.reads||0)+1;return o;});}
  function incTasbih(){setStats(function(s){var o=Object.assign({},s);o.tasbih=(s.tasbih||0)+1;return o;});}
  function incAzkar(){setStats(function(s){var o=Object.assign({},s);o.azkar=(s.azkar||0)+1;return o;});}
  function togFav(type,key,data){
    setFavs(function(f){
      var cat=Object.assign({},f[type]||{});
      if(cat[key])delete cat[key];else if(data)cat[key]=data;
      var nf=Object.assign({},f);nf[type]=cat;
      setStats(function(s){var o=Object.assign({},s);o.favAyahs=Object.keys(nf.ayahs||{}).length;return o;});
      return nf;
    });
  }
  
  var navItems=[
    {id:"home",icon:"🏠",l:"الرئيسية"},
    {id:"quran",icon:"📖",l:"القرآن"},
    {id:"azkar",icon:"🌿",l:"الأذكار"},
    {id:"tasbih",icon:"📿",l:"المسبحة"},
    {id:"wird",icon:"📅",l:"الورد"},
  ];
  
  return h(React.Fragment,null,
    h(Header,{screen:screen,theme:theme,toggleTheme:toggleTheme,go:setScreen}),
    screen==="home"&&h(Home,{go:setScreen,stats:stats,pTimes:pTimes,pLoading:pLoad,pError:pErr,city:city,reqGeo:reqGeo}),
    screen==="quran"&&h(Quran,{favs:favs,togFav:togFav,onRead:incReads}),
    screen==="azkar"&&h(Azkar,{onDone:incAzkar}),
    screen==="tasbih"&&h(Tasbih,{onTap:incTasbih}),
    screen==="hadith"&&h(Hadith,{favs:favs,togFav:togFav}),
    screen==="wird"&&h(Wird,null),
    screen==="favorites"&&h(Favorites,{favs:favs,togFav:togFav}),
    screen==="stats"&&h(Stats,{stats:stats,favs:favs}),
    screen==="settings"&&h(Settings,{theme:theme,toggleTheme:toggleTheme,color:color,setColor:setColor}),
    h("div",{className:"nav"},
      navItems.map(function(n){
        return h("button",{key:n.id,className:"nbtn"+(screen===n.id?" on":""),onClick:function(){setScreen(n.id);}},
          h("span",{className:"ni"},n.icon),h("span",null,n.l)
        );
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(h(App,null));
})();
</script>
</body>
</html>
