<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>نور | Noor Islamic App</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Amiri&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0f172a;
--card:rgba(255,255,255,0.05);
--glass:rgba(255,255,255,0.08);
--gold:#facc15;
--primary:#6366f1;
--radius:18px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
background:linear-gradient(135deg,#0f172a,#111827);
color:white;
font-family:'Cairo',sans-serif;
min-height:100vh;
overflow-x:hidden;
}

#root{min-height:100vh;display:flex;flex-direction:column}

.header{
padding:40px 20px 20px;
text-align:center;
background:linear-gradient(180deg,rgba(255,255,255,0.05),transparent);
}

.header h1{
font-size:28px;
font-weight:800;
background:linear-gradient(90deg,#facc15,#6366f1);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.card{
background:var(--card);
backdrop-filter:blur(12px);
border-radius:var(--radius);
padding:18px;
margin:12px 16px;
transition:.3s;
border:1px solid rgba(255,255,255,0.08);
}

.card:hover{
transform:translateY(-5px);
background:var(--glass);
}

.ayah{
font-family:'Amiri',serif;
font-size:24px;
line-height:2;
text-align:center;
}

.button{
background:linear-gradient(135deg,#6366f1,#facc15);
border:none;
padding:12px 20px;
border-radius:12px;
color:black;
font-weight:700;
cursor:pointer;
margin-top:15px;
transition:.3s;
}

.button:hover{
transform:scale(1.05);
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(15px);
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid rgba(255,255,255,0.1);
}

.nav button{
background:none;
border:none;
color:white;
font-size:12px;
display:flex;
flex-direction:column;
align-items:center;
cursor:pointer;
opacity:.6;
}

.nav button.active{
opacity:1;
color:var(--gold);
}

.nav i{
width:20px;
height:20px;
margin-bottom:4px;
}

.main{
flex:1;
padding-bottom:80px;
}

.list-item{
padding:14px;
background:var(--card);
margin:8px 16px;
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.list-item:hover{
background:var(--glass);
}

</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const { useState } = React;

/* بيانات */
const SURAHS = [
{ id:1,name:"الفاتحة" },
{ id:112,name:"الإخلاص" },
{ id:113,name:"الفلق" },
{ id:114,name:"الناس" },
];

const QURAN = {
1:["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
"الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
"الرَّحْمَٰنِ الرَّحِيمِ",
"مَالِكِ يَوْمِ الدِّينِ",
"إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",
"اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",
"صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ"],
112:["قُلْ هُوَ اللَّهُ أَحَدٌ","اللَّهُ الصَّمَدُ","لَمْ يَلِدْ وَلَمْ يُولَدْ","وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ"],
113:["قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","مِن شَرِّ مَا خَلَقَ","وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ"],
114:["قُلْ أَعُوذُ بِرَبِّ النَّاسِ","مَلِكِ النَّاسِ","إِلَٰهِ النَّاسِ"]
};

/* الشاشات */
function Home({setScreen}){
return(
<>
<div className="header">
<h1>نور</h1>
<p>تطبيق إسلامي عصري</p>
</div>

<div className="card">
<div className="ayah">
إِنَّ مَعَ الْعُسْرِ يُسْرًا
</div>
</div>

<div style={{textAlign:"center"}}>
<button className="button" onClick={()=>setScreen("quran")}>
دخول القرآن
</button>
</div>
</>
);
}

function Quran({setScreen}){
const [selected,setSelected]=useState(null);

if(selected){
return(
<div className="main">
<div className="header">
<h1>{selected.name}</h1>
<button className="button" onClick={()=>setSelected(null)}>رجوع</button>
</div>
<div className="card">
{QURAN[selected.id].map((a,i)=>(
<p key={i} className="ayah">{a}</p>
))}
</div>
</div>
);
}

return(
<div className="main">
<div className="header">
<h1>القرآن الكريم</h1>
</div>

{SURAHS.map(s=>(
<div key={s.id} className="list-item" onClick={()=>setSelected(s)}>
{s.name}
</div>
))}

<div style={{textAlign:"center"}}>
<button className="button" onClick={()=>setScreen("home")}>
الرئيسية
</button>
</div>
</div>
);
}

/* التطبيق */
function App(){
const [screen,setScreen]=useState("home");

return(
<>
<div className="main">
{screen==="home" && <Home setScreen={setScreen}/>}
{screen==="quran" && <Quran setScreen={setScreen}/>}
</div>

<div className="nav">
<button className={screen==="home"?"active":""} onClick={()=>setScreen("home")}>
<i data-lucide="home"></i>
الرئيسية
</button>

<button className={screen==="quran"?"active":""} onClick={()=>setScreen("quran")}>
<i data-lucide="book-open"></i>
القرآن
</button>
</div>
</>
);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

lucide.createIcons();

</script>
</body>
</html>
