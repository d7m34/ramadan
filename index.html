  get: (key, def = null) => {

  .compass-needle {
    position: absolute; width: 4px; height: 80px; top: 50%; left: 50%;
    transform-origin: 50% 100%;
    transform: translateX(-50%) translateY(-100%) rotate(0deg);
    transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);

// ==================== HELPERS ====================
function getPrayerTimes() {
  const now = new Date();
  const base = new Date(now);
  base.setHours(0, 0, 0, 0);
  return PRAYERS.map((p) => {
    const t = new Date(base);
    t.setHours(p.offset + 4, 30 + Math.floor(Math.random() * 15), 0, 0);
    return { ...p, time: t };
  });
}

function formatTime(d) {
  return d.toLocaleTimeString("ar-SA", { hour: "2-digit", minute: "2-digit", hour12: true });
}

function formatCountdown(ms) {
  if (ms < 0) return "الوقت انتهى";
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${h > 0 ? h + "س " : ""}${m}د ${s}ث`;
}

function getHijriDate() {
  const now = new Date();
  const hijri = new Intl.DateTimeFormat("ar-SA-u-ca-islamic", {
    year: "numeric", month: "long", day: "numeric",
  }).format(now);
  return hijri;
}

// ==================== CIRCULAR PROGRESS ====================
function CircularProgress({ pct, size = 200, stroke = 12, label = "" }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const off = circ - (pct / 100) * circ;
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="url(#goldGrad)" strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round"
          style={{ transition: "stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1)" }} />
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#C9A84C" />
            <stop offset="100%" stopColor="#E8C97A" />
          </linearGradient>
        </defs>
      </svg>
      <div className="khatma-circle-text">
        <span className="khatma-pct">{Math.round(pct)}%</span>
        <span className="khatma-pct-label">{label}</span>
      </div>
    </div>
  );
}

function PrayerScreen() {
  const [tab, setTab] = useState("times");
  const [prayerTimes] = useState(getPrayerTimes);
  const [now, setNow] = useState(new Date());
  const [thikrCounts, setThikrCounts] = useState(() => storage.get("thikr_counts", {}));
  const [filterCat, setFilterCat] = useState("عام");

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  const nextPrayer = prayerTimes.find((p) => p.time > now) || prayerTimes[0];
  const countdown = nextPrayer ? nextPrayer.time - now : 0;

  const tapThikr = (idx) => {
    const max = ATHKAR[idx].count;
    const curr = thikrCounts[idx] || 0;
    const next = curr >= max ? 0 : curr + 1;
    const updated = { ...thikrCounts, [idx]: next };
    const total = (storage.get("thikr_total", 0) || 0) + 1;
    storage.set("thikr_total", total);
    storage.set("thikr_counts", updated);
    setThikrCounts(updated);
  };

  return (
    <div>
      <div className="header">
        <div className="header-title">الصلاة والأذكار</div>
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          {["times", "athkar"].map((t) => (
            <button key={t} className={`filter-chip${tab === t ? " active" : ""}`} onClick={() => setTab(t)}>
              {t === "times" ? "🕐 مواقيت" : "📿 أذكار"}
            </button>
          ))}
        </div>
      </div>

      {tab === "times" && (
        <>
          <div className="prayer-next-card">
            <div className="prayer-next-label">الصلاة القادمة</div>
            <div className="prayer-next-name">{nextPrayer?.name}</div>
            <div className="prayer-next-time">{nextPrayer ? formatTime(nextPrayer.time) : "--"}</div>
            <div className="prayer-next-countdown">بعد {formatCountdown(countdown)}</div>
          </div>

          <div className="prayer-grid">
            {prayerTimes.map((p) => (
              <div key={p.name} className={`prayer-card${p.name === nextPrayer?.name ? " next" : ""}`}>
                <div className="prayer-card-icon">{p.icon}</div>
                <div className="prayer-card-name">{p.name}</div>
                <div className="prayer-card-time">{formatTime(p.time)}</div>
              </div>
            ))}
          </div>
        </>
      )}

      {tab === "athkar" && (
        <>
          <div className="athkar-filter">
            {["عام", "صباح", "مساء", "نوم"].map((c) => (
              <button key={c} className={`filter-chip${filterCat === c ? " active" : ""}`} onClick={() => setFilterCat(c)}>
                {c}
              </button>
            ))}
          </div>
          {ATHKAR.filter((a) => filterCat === "عام" || a.category === filterCat).map((a, i) => {
            const curr = thikrCounts[i] || 0;
            const done = curr >= a.count;
            return (
              <div key={i} className="thikr-card" onClick={() => tapThikr(i)}
                style={{ opacity: done ? 0.6 : 1, borderColor: done ? "var(--green)" : "var(--border)" }}>
                <div className="thikr-text">{a.text}</div>
                <div className="thikr-counter-row">
                  <div className="thikr-count-badge">
                    <span>{curr}</span>/<span>{a.count}</span>
                  </div>
                  {done
                    ? <span style={{ color: "var(--green-light)", fontSize: 13, fontWeight: 700 }}>✓ تمّ</span>
                    : <span className="thikr-tap">اضغط للعد</span>}
                </div>
              </div>
            );
          })}
        </>
      )}

  );
}

// ==================== QIBLA SCREEN ====================
function QiblaScreen() {
  const [angle, setAngle] = useState(null);
  const [status, setStatus] = useState("جاري تحديد الموقع...");
  const [deviceAngle, setDeviceAngle] = useState(0);

  useEffect(() => {
    if (!navigator.geolocation) { setStatus("الموقع غير مدعوم"); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude: lat, longitude: lng } = pos.coords;
        const meccaLat = 21.3891;
        const meccaLng = 39.8579;
        const dLng = (meccaLng - lng) * (Math.PI / 180);
        const lat1 = lat * (Math.PI / 180);
        const lat2 = meccaLat * (Math.PI / 180);
        const y = Math.sin(dLng) * Math.cos(lat2);
        const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
        let bearing = (Math.atan2(y, x) * 180) / Math.PI;
        bearing = (bearing + 360) % 360;
        setAngle(bearing);
        setStatus(`اتجاه القبلة: ${Math.round(bearing)}° من الشمال`);
      },
      () => { setStatus("تعذّر الحصول على الموقع"); setAngle(45); }
    );

    const handleOrientation = (e) => setDeviceAngle(e.alpha || 0);
    if (typeof DeviceOrientationEvent !== "undefined") {
      window.addEventListener("deviceorientation", handleOrientation);
    }
    return () => window.removeEventListener("deviceorientation", handleOrientation);
  }, []);

  const needleAngle = angle !== null ? angle - deviceAngle : 0;

  return (
    <div>
      <div className="header">
        <div className="header-title">اتجاه القبلة 🧭</div>
        <div className="header-sub">حساب دقيق بناءً على موقعك</div>
      </div>

      <div className="qibla-container">
        <div className="compass-wrap">
          <div className="compass-outer">
            <div className="compass-ring" />
            <div className="compass-ring2" />
            <div className="kaaba-icon">🕋</div>
            <div className="compass-needle" style={{ transform: `translateX(-50%) translateY(-100%) rotate(${needleAngle}deg)` }} />
            <div className="compass-center" />
          </div>
        </div>

        <div className="qibla-degrees">{angle !== null ? `${Math.round(angle)}°` : "---"}</div>
        <div className="qibla-status">{status}</div>

        {angle !== null && (
          <div style={{ marginTop: 24, textAlign: "center" }}>
            <div className="card" style={{ maxWidth: 300, margin: "0 auto" }}>
              <div style={{ fontSize: 13, color: "var(--text-dim)", lineHeight: 1.8 }}>
                وجّه نفسك حتى تتحاذى الإبرة الذهبية مع الكعبة المشرّفة ↑
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ==================== KHATMA SCREEN ====================
function KhatmaScreen() {
  const [pagesRead, setPagesRead] = useState(() => storage.get("khatma_pages_read", 0));
  const [daysTarget, setDaysTarget] = useState(30);
  const [todayInput, setTodayInput] = useState("");
  const [log, setLog] = useState(() => storage.get("khatma_log", []));
  const TOTAL = 604;

  const pct = Math.min((pagesRead / TOTAL) * 100, 100);
  const remaining = TOTAL - pagesRead;
  const pagesPerDay = daysTarget > 0 ? Math.ceil(remaining / daysTarget) : 0;

  const addPages = () => {
    const n = parseInt(todayInput);
    if (!n || n <= 0) return;
    const newTotal = Math.min(pagesRead + n, TOTAL);
    const newLog = [{ date: new Date().toLocaleDateString("ar-SA"), pages: n }, ...log.slice(0, 19)];
    storage.set("khatma_pages_read", newTotal);
    storage.set("khatma_log", newLog);
    setPagesRead(newTotal);
    setLog(newLog);
    setTodayInput("");
  };

  const reset = () => {
    storage.set("khatma_pages_read", 0);
    storage.set("khatma_log", []);
    setPagesRead(0);
    setLog([]);
  };

  return (
    <div>
      <div className="header">
        <div className="header-title">متابعة الختمة 📚</div>
        <div className="header-sub">المصحف الشريف • ٦٠٤ صفحة</div>
      </div>

      <div className="khatma-progress-wrap">
        <div className="khatma-circle">
          <CircularProgress pct={pct} size={200} label="مكتمل" />
        </div>
      </div>

      <div className="khatma-stats">
        <div className="stat-card">
          <div className="stat-val">{pagesRead}</div>
          <div className="stat-label">صفحة مقروءة</div>
        </div>
        <div className="stat-card">
          <div className="stat-val">{remaining}</div>
          <div className="stat-label">صفحة متبقية</div>
        </div>
        <div className="stat-card">
          <div className="stat-val" style={{ fontSize: 18 }}>{pagesPerDay}</div>
          <div className="stat-label">صفحة/يوم</div>
        </div>
      </div>

      <div className="khatma-form">
        <div className="form-label">⏱️ الهدف الزمني</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          {[30, 60, 90].map((d) => (
            <button key={d} className={`filter-chip${daysTarget === d ? " active" : ""}`}
              style={{ flex: 1, textAlign: "center" }} onClick={() => setDaysTarget(d)}>
              {d} يوم
            </button>
          ))}
        </div>

        <div className="form-label">📄 أضف صفحات اليوم</div>
        <input className="form-input" type="number" placeholder="عدد الصفحات"
          value={todayInput} onChange={(e) => setTodayInput(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addPages()} />
        <button className="form-btn" onClick={addPages}>تسجيل القراءة</button>

        <button onClick={reset}
          style={{ width: "100%", marginTop: 10, padding: "10px", background: "none", border: "1px solid rgba(255,80,80,0.3)", borderRadius: 12, color: "rgba(255,100,100,0.7)", fontSize: 13, cursor: "pointer", fontFamily: "Cairo, sans-serif" }}>
          إعادة تعيين الختمة
        </button>
      </div>

      {log.length > 0 && (
        <div className="khatma-log">
          <div className="section-title" style={{ padding: "0 0 12px" }}>📅 سجل القراءة</div>
          {log.map((l, i) => (
            <div key={i} className="khatma-log-item">
              <div>
                <div style={{ fontSize: 14, fontWeight: 600 }}>جلسة قراءة</div>
                <div className="log-date">{l.date}</div>
              </div>
              <div className="log-pages">+{l.pages} صفحة</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

          {screen === "khatma" && <KhatmaScreen />}
        </main>

        <nav className="nav">
          {SCREENS.map((s) => (
            <button key={s.id} className={`nav-btn${screen === s.id ? " active" : ""}`} onClick={() => setScreen(s.id)}>
              <span className="nav-icon">{s.icon}</span>
              <span className="nav-label">{s.label}</span>
            </button>
          ))}
        </nav>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
